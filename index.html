  <script>
/**
 * CHAKRIKA TERMINAL WORKBENCH CONTROLLER
 * ILLUSTRATED BLUEPRINT & WARM PARCHMENT EDITION
 * Wires the 3-Column Institutional Workbench, Illustrated Parchment / Dark Theme Switcher,
 * Live Phase Story Banner, Bidirectional Hover Sync, Animated KPI Counters, and 3-Tab Inspector.
 */
(function (global) {
  'use strict';

  const { Data, GraphEngine, FSM, GraphRenderer } = global.Chakrika;
  const { escapeHtml } = global.Chakrika;
  const { formatINR, formatLakhs, PHASES, ClearingStateMachine } = FSM;

  class ChakrikaWorkbenchApp {
    constructor() {
      this.currentClusterId = 'PEENYA-094';
      this.cluster = Data.cloneCluster(this.currentClusterId);

      // Default to 'illustrated' (Warm Parchment & Navy Blueprint matching reference image)
      this.theme = 'illustrated';
      try {
        const savedTheme = window.localStorage.getItem('chakrika_visual_theme_v2');
        if (savedTheme === 'dark' || savedTheme === 'illustrated') {
          this.theme = savedTheme;
        }
      } catch (_e) {
        // Ignore storage errors
      }

      // Engine options
      this.clearanceMode = 'FULL_RING_DELTA_BRIDGE'; // 'FULL_RING_DELTA_BRIDGE' | 'BOTTLENECK_ONLY'
      this.tdsMode = 'STATUTORY'; // 'STATUTORY' | 'UNIFORM_194C_2' | 'GROSS_NO_TDS'
      this.invoiceFilter = 'ALL'; // 'ALL' | 'ITC_RISK' | 'RING_ONLY'
      this.selectedCycleIndex = 0;

      // UI state
      this.activeRightTab = 'TELEMETRY'; // 'TELEMETRY' | 'TOKEN_HTLC' | 'STATUTORY_LEDGER'
      this.timelineCollapsed = false;
      this.layoutOverride = null;
      this.timelineHeightPx = 115; // Resizable height for bottom log list
      this.jsonDrawerExpanded = true;
      this.editingInvoiceId = null;

      this.prevKpiValues = {};

      // Evaluate initial graph
      this.graphEval = this._evaluateGraph();

      // Initialize FSM
      this.fsm = new ClearingStateMachine(() => {
        this.renderAll();
      });
    }

    init() {
      this._applyThemeToDom();

      const svgEl = document.getElementById('supply-chain-svg');
      const tooltipEl = document.getElementById('graph-entity-tooltip');

      this.graphRenderer = new GraphRenderer(svgEl, tooltipEl, {
        onSelectEntity: (type, id) => {
          this._highlightSelectedEntityInTables(type, id);
        },
        onHoverEntity: (type, id) => {
          this._syncExternalHoverState(type, id);
        },
        onZoomChange: zoom => {
          const zEl = document.getElementById('btn-zoom-level');
          if (zEl) zEl.textContent = `${Math.round(zoom * 100)}%`;
        }
      });
      this.graphRenderer.setTheme(this.theme);

      this._bindGlobalControls();
      this.fsm.initializeForGraph(this.graphEval, false);
      this._applyUrlQueryParams();
    }

    _applyThemeToDom() {
      const htmlEl = document.documentElement;
      htmlEl.setAttribute('data-theme', this.theme);
      if (this.theme === 'dark') {
        htmlEl.classList.add('dark');
      } else {
        htmlEl.classList.remove('dark');
      }
      const themeBtn = document.getElementById('btn-theme-toggle');
      if (themeBtn) {
        themeBtn.innerHTML =
          this.theme === 'illustrated'
            ? `<span>🖥</span> <span>Dark Mode</span>`
            : `<span>🎨</span> <span>Parchment</span>`;
      }
    }

    toggleTheme() {
      this.theme = this.theme === 'illustrated' ? 'dark' : 'illustrated';
      try {
        window.localStorage.setItem('chakrika_visual_theme_v2', this.theme);
      } catch (_e) {
        // Ignore storage errors
      }
      this._applyThemeToDom();
      if (this.graphRenderer) {
        this.graphRenderer.setTheme(this.theme);
      }
      this.renderAll();
    }

    showToast(message, tone = 'info') {
      const toastEl = document.getElementById('workbench-toast');
      if (!toastEl) return;
      const toneClass =
        tone === 'error'
          ? 'pill-dr'
          : tone === 'success'
          ? 'pill-cr'
          : 'pill-sky';

      toastEl.className = `fixed bottom-4 right-4 z-50 px-4 py-2.5 shadow-xl font-mono text-xs transition-all ${toneClass}`;
      toastEl.textContent = message;
      toastEl.classList.remove('hidden');

      clearTimeout(this._toastTimer);
      this._toastTimer = setTimeout(() => {
        toastEl.classList.add('hidden');
      }, 2800);
    }

    _copyTextToClipboard(text, successMsg = 'Copied to clipboard!') {
      const fallbackCopy = () => {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          this.showToast(successMsg, 'success');
        } catch (_err) {
          this.showToast('Select text manually to copy.', 'info');
        }
        document.body.removeChild(ta);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          () => this.showToast(successMsg, 'success'),
          () => fallbackCopy()
        );
      } else {
        fallbackCopy();
      }
    }

    _applyUrlQueryParams() {
      const params = new URLSearchParams(window.location.search);
      if (!params || Array.from(params.keys()).length === 0) return;

      const clusterParam = params.get('cluster');
      if (clusterParam && Data.CLUSTERS[clusterParam]) {
        this.currentClusterId = clusterParam;
        this.cluster = Data.cloneCluster(clusterParam);
        const sel = document.getElementById('cluster-selector');
        if (sel) sel.value = clusterParam;
      }

      const modeParam = params.get('mode');
      if (modeParam === 'BOTTLENECK_ONLY' || modeParam === 'FULL_RING_DELTA_BRIDGE') {
        this.clearanceMode = modeParam;
      }

      const layoutParam = params.get('layout');
      if (layoutParam === 'RING' || layoutParam === 'CLUSTER') {
        this.layoutOverride = layoutParam;
      }

      const tabParam = params.get('tab');
      if (tabParam === 'TELEMETRY' || tabParam === 'TOKEN_HTLC' || tabParam === 'STATUTORY_LEDGER') {
        this.activeRightTab = tabParam;
      }

      const themeParam = params.get('theme');
      if (themeParam === 'illustrated' || themeParam === 'dark') {
        this.theme = themeParam;
        this._applyThemeToDom();
        this.graphRenderer.setTheme(this.theme);
      }

      if (params.get('fault') === '1') {
        this.fsm.faultInjectionEnabled = true;
      }

      this.graphEval = this._evaluateGraph();
      const phaseParam = Number(params.get('phase'));
      if (phaseParam >= 1 && phaseParam <= 5) {
        this.fsm.jumpToPhase(phaseParam, this.graphEval);
        const hopsParam = Number(params.get('hops'));
        if (phaseParam === 4 && hopsParam > 0) {
          for (let i = 0; i < hopsParam; i++) {
            this.fsm.stepForward(this.graphEval);
          }
        }
      } else {
        this.renderAll();
      }
    }

    _evaluateGraph() {
      return GraphEngine.evaluateClusterGraph(this.cluster, {
        clearanceMode: this.clearanceMode,
        tdsMode: this.tdsMode,
        selectedCycleIndex: this.selectedCycleIndex,
        itcRiskThreshold: 150
      });
    }

    recomputeGraphAndSync(preservePhase = false) {
      const prevPhase = this.fsm.phase;
      this.graphEval = this._evaluateGraph();
      if (preservePhase && this.graphEval.active_ring) {
        this.fsm.jumpToPhase(prevPhase, this.graphEval);
      } else {
        this.fsm.initializeForGraph(this.graphEval, true);
      }
      this.renderAll();
    }

    _bindGlobalControls() {
      const clusterSel = document.getElementById('cluster-selector');
      if (clusterSel) {
        clusterSel.addEventListener('change', e => {
          this.currentClusterId = e.target.value;
          this.cluster = Data.cloneCluster(this.currentClusterId);
          this.selectedCycleIndex = 0;
          this.graphEval = this._evaluateGraph();
          this.fsm.initializeForGraph(this.graphEval, false);
        });
      }

      document.getElementById('btn-theme-toggle')?.addEventListener('click', () => {
        this.toggleTheme();
      });

      const faultBtn = document.getElementById('btn-fault-toggle');
      if (faultBtn) {
        faultBtn.addEventListener('click', () => {
          this.fsm.faultInjectionEnabled = !this.fsm.faultInjectionEnabled;
          this.fsm.addLog(
            'FAULT-CONFIG',
            this.fsm.faultInjectionEnabled
              ? 'Fault Injection ARMED: Hop 3 Switch Timeout (>1500ms HTLC Expiry)'
              : 'Fault Injection DISARMED: Normal Atomic Settlement Restored',
            this.fsm.faultInjectionEnabled
              ? 'Next Phase 4 run will simulate Partner Bank switch timeout at Hop 3 and trigger atomic HTLC rollback.'
              : 'All cross-bank CBDC switches responding within 95ms SLA.',
            this.fsm.faultInjectionEnabled ? 'WARN' : 'INFO'
          );
          this.renderAll();
        });
      }

      document.getElementById('btn-step-forward')?.addEventListener('click', () => {
        this.fsm.stepForward(this.graphEval);
      });

      document.getElementById('btn-auto-run')?.addEventListener('click', () => {
        if (this.fsm.isAutoRunning) {
          this.fsm.stopAutoRun();
        } else {
          this.fsm.startAutoRun(this.graphEval);
        }
      });

      document.getElementById('btn-reset-sim')?.addEventListener('click', () => {
        this.fsm.reset(this.graphEval);
      });

      document.getElementById('mode-delta-bridge')?.addEventListener('click', () => {
        if (this.clearanceMode !== 'FULL_RING_DELTA_BRIDGE') {
          this.clearanceMode = 'FULL_RING_DELTA_BRIDGE';
          this.recomputeGraphAndSync(true);
        }
      });

      document.getElementById('mode-bottleneck')?.addEventListener('click', () => {
        if (this.clearanceMode !== 'BOTTLENECK_ONLY') {
          this.clearanceMode = 'BOTTLENECK_ONLY';
          this.recomputeGraphAndSync(true);
        }
      });

      document.getElementById('tds-mode-selector')?.addEventListener('change', e => {
        this.tdsMode = e.target.value;
        this.recomputeGraphAndSync(true);
      });

      document.querySelectorAll('[data-inv-filter]').forEach(btn => {
        btn.addEventListener('click', () => {
          this.invoiceFilter = btn.getAttribute('data-inv-filter');
          this.renderLeftPanel();
        });
      });

      document.getElementById('btn-open-invoice-modal')?.addEventListener('click', () => {
        this.openInvoiceModal(null);
      });
      document.getElementById('btn-close-invoice-modal')?.addEventListener('click', () => {
        this.closeInvoiceModal();
      });
      document.getElementById('btn-cancel-invoice-modal')?.addEventListener('click', () => {
        this.closeInvoiceModal();
      });
      document.getElementById('invoice-modal-form')?.addEventListener('submit', e => {
        e.preventDefault();
        this.saveInvoiceFromModal();
      });

      for (const [id, mode] of [['auto', null], ['cluster', 'CLUSTER'], ['ring', 'RING']]) {
        document.getElementById(`btn-layout-${id}`)?.addEventListener('click', () => {
          this.layoutOverride = mode;
          this.graphRenderer.setLayoutMode(this._currentGraphLayout());
          this.renderCenterHeader();
        });
      }
      document.getElementById('btn-reset-zoom')?.addEventListener('click', () => {
        this.graphRenderer.customNodeOffsets = {};
        this.graphRenderer.resetViewport();
        this.graphRenderer.render();
      });

      document.getElementById('btn-zoom-in')?.addEventListener('click', () => {
        this.graphRenderer.zoomIn();
      });

      document.getElementById('btn-zoom-out')?.addEventListener('click', () => {
        this.graphRenderer.zoomOut();
      });

      document.getElementById('btn-zoom-level')?.addEventListener('click', () => {
        this.graphRenderer.resetViewport();
        this.graphRenderer.render();
      });

      document.getElementById('btn-toggle-timeline')?.addEventListener('click', () => {
        this.timelineCollapsed = !this.timelineCollapsed;
        this.renderTimeline();
      });

      this._initTimelineResizeDrag();

      document.querySelectorAll('[data-right-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
          this.activeRightTab = btn.getAttribute('data-right-tab');
          this.renderRightPanel();
        });
      });
    }

    _currentGraphLayout() {
      if (!this.graphEval.active_ring) return 'CLUSTER';
      return this.layoutOverride || (this.fsm.phase >= 3 ? 'RING' : 'CLUSTER');
    }

    renderAll() {
      this.graphRenderer.setLayoutMode(this._currentGraphLayout(), false);
      this.renderTopHeader();
      this.renderLeftPanel();
      this.renderCenterHeader();
      this.renderPhaseStoryBanner();
      this.graphRenderer.update(this.graphEval, this.fsm);
      this.renderHopProgressStrip();
      this.renderTimeline();
      this.renderRightPanel();
    }

    renderTopHeader() {
      const stepperContainer = document.getElementById('phase-stepper-container');
      if (stepperContainer) {
        stepperContainer.innerHTML = PHASES.map(p => {
          const isCurrent = this.fsm.phase === p.id;
          const isCompleted = this.fsm.phase > p.id;
          const isFaultedPhase = isCurrent && this.fsm.faultTriggered;

          let stateStyle =
            'background-color: #243861; color: #CBD5E1; border-color: #0B1324;';
          let dotStyle = 'background-color: #94A3B8;';

          if (isFaultedPhase) {
            stateStyle = 'background-color: #F29B76; color: #1E2430; border-color: #1E2430;';
            dotStyle = 'background-color: #B91C1C;';
          } else if (isCurrent) {
            stateStyle = 'background-color: #FDF3DC; color: #1E2430; border-color: #1E2430;';
            dotStyle = 'background-color: #2D6CDF;';
          } else if (isCompleted) {
            stateStyle = 'background-color: #9ED29E; color: #1E2430; border-color: #1E2430;';
            dotStyle = 'background-color: #15803D;';
          }

          return `
            <button type="button" data-step-phase="${p.id}" title="${p.subtitle}"
              style="${stateStyle}"
              class="phase-step-btn transition-all">
              <span class="w-2.5 h-2.5 rounded-full border border-black/40" style="${dotStyle}"></span>
              <span class="font-extrabold">${p.shortTitle}</span>
            </button>
          `;
        }).join('');

        stepperContainer.querySelectorAll('[data-step-phase]').forEach(btn => {
          btn.addEventListener('click', () => {
            const target = Number(btn.getAttribute('data-step-phase'));
            this.fsm.jumpToPhase(target, this.graphEval);
          });
        });
      }

      const faultBtn = document.getElementById('btn-fault-toggle');
      if (faultBtn) {
        if (this.fsm.faultInjectionEnabled) {
          faultBtn.className =
            'tactile-btn flex items-center gap-1.5 px-3 py-1 text-[11px] pill-dr';
          faultBtn.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-700 animate-ping"></span><span>Fault: ON (Hop 3)</span>`;
        } else {
          faultBtn.className =
            'tactile-btn flex items-center gap-1.5 px-3 py-1 text-[11px] bg-[#FDF3DC] text-[#1E2430]';
          faultBtn.innerHTML = `<span class="w-2 h-2 rounded-full bg-slate-500"></span><span>Fault: OFF</span>`;
        }
      }

      const autoBtn = document.getElementById('btn-auto-run');
      if (autoBtn) {
        if (this.fsm.isAutoRunning) {
          autoBtn.className = 'tactile-btn px-3 py-1 text-[11px] pill-amber';
          autoBtn.textContent = '⏸ Pause';
        } else {
          autoBtn.className = 'tactile-btn px-3 py-1 text-[11px] pill-cr';
          autoBtn.textContent = '▶ Auto-Run';
        }
      }
    }

    /**
     * Live Plain-English Phase Story Banner on Center Canvas
     */
    renderPhaseStoryBanner() {
      const bannerEl = document.getElementById('phase-story-banner');
      if (!bannerEl) return;

      const ring = this.graphEval.active_ring;
      if (!ring) {
        bannerEl.innerHTML = `
          <div class="phase-story mx-3 mt-2 p-2.5 surface-card flex items-center justify-between gap-3 text-xs">
            <div class="flex flex-wrap items-center gap-2">
              <span class="px-2 py-0.5 pill-amber text-[10px] font-mono">ACYCLIC TOPOLOGY</span>
              <p class="text-theme-main font-bold">Add a closing invoice to form a ring, or restore the default cluster.</p>
            </div>
            <button type="button" id="btn-banner-reset-cluster" class="tactile-btn px-3 py-1 pill-sky text-[10.5px] shrink-0">
              Restore Default Ring
            </button>
          </div>
        `;
        bannerEl.querySelector('#btn-banner-reset-cluster')?.addEventListener('click', () => {
          this.cluster = Data.cloneCluster(this.currentClusterId);
          this.recomputeGraphAndSync(false);
        });
        return;
      }

      const phase = this.fsm.phase;
      const isDelta = this.clearanceMode === 'FULL_RING_DELTA_BRIDGE';
      const faultHop = this.fsm.hopStates.indexOf('FAULTED') + 1;
      const itcCount = this.graphEval.edges.filter(e => e.is_itc_risk).length;

      let badgeText = `STEP 0${phase}`;
      let badgeCls = 'pill-sky';
      let headline = '';
      let narrative = '';
      let nextBtnLabel = 'Next Step ➔';

      if (phase === 1) {
        badgeCls = 'pill-amber';
        headline = '1. Supply-Chain Debt Gridlock:';
        narrative = `${ring.hop_count} MSMEs owe each other ${formatLakhs(ring.w_gross_inr)} in a circle (${itcCount} cluster invoices flagged for ITC risk).`;
        nextBtnLabel = '2. Compress Ring ➔';
      } else if (phase === 2) {
        badgeCls = 'pill-delta';
        headline = isDelta ? `2. SGX Cycle Compression (${ring.compression_ratio_pct.toFixed(1)}%):`
          : `2. Bottleneck Coverage (${ring.bottleneck_coverage_pct.toFixed(1)}%):`;
        narrative = isDelta
          ? `Intel SGX found that injecting just ${formatLakhs(ring.l_bridge_inr)} of NBFC Δ-Bridge credit clears ${formatLakhs(ring.w_gross_inr)} of debt (${ring.money_velocity.toFixed(1)}x velocity).`
          : `Mode 1 Pure Bottleneck loops a ${formatLakhs(ring.f_min_inr)} flash seed across all ${ring.hop_count} hops to clear ${formatLakhs(ring.bottleneck_extinguished_inr)} with ₹0 external loan.`;
        nextBtnLabel = '3. Mint e₹ Token ➔';
      } else if (phase === 3) {
        badgeCls = 'pill-delta';
        headline = '3. Programmable e₹ Token Minted:';
        narrative = isDelta
          ? `Partner NBFC (${this.graphEval.partner_nbfc.issuer_bank_ifsc}) locked ${formatLakhs(ring.l_bridge_inr)} Δ-Bridge + ${formatLakhs(ring.f_min_inr)} Flash Seed into token ${ring.crypto.rbi_serial_id} with a SHA-256 padlock.`
          : `Issued ${formatLakhs(ring.f_min_inr)} Flash Carrier Seed locked to traverse all ${ring.hop_count} hops and return within 1500ms.`;
        nextBtnLabel = '4. Lock Hop 1 ➔';
      } else if (phase === 4) {
        if (this.fsm.faultTriggered && !this.fsm.rollbackCompleted) {
          badgeText = 'FAULT >1500ms';
          badgeCls = 'pill-dr';
          headline = `Partner Bank Switch Timeout at Hop ${faultHop}:`;
          narrative = `The SGX preimage is withheld. Revert the provisional payment locks to complete the rollback.`;
          nextBtnLabel = 'Rollback Ring ↺';
        } else if (this.fsm.rollbackCompleted) {
          badgeText = 'REVERTED ↺';
          badgeCls = 'pill-amber';
          headline = 'Zero-Loss Atomic Rollback Complete:';
          narrative = `All provisional hop locks reverted to ₹0 and ${formatLakhs(ring.active_external_credit_inr)} in external credit was released. Reset with Fault OFF to simulate settlement.`;
          nextBtnLabel = 'Reset Run ↺';
        } else {
          const lockedHops = this.fsm.hopStates.filter(s => s === 'LOCKED').length;
          badgeText = `HOP ${lockedHops}/${ring.hop_count} LOCKED`;
          badgeCls = 'pill-sky';
          headline = '4. Cross-Bank HTLC Hop Locking:';
          narrative = `${lockedHops} of ${ring.hop_count} bank CBDC switches have locked their hop payments. Once all ${ring.hop_count} hops lock within 1500ms, the padlock opens simultaneously!`;
          nextBtnLabel =
            lockedHops < ring.hop_count
              ? `Lock Hop ${lockedHops + 1}/${ring.hop_count} ➔`
              : '5. Unlock & Settle ➔';
        }
      } else if (phase === 5) {
        badgeText = 'SETTLED ✓';
        badgeCls = 'pill-cr';
        headline = isDelta || ring.active_residual_inr === 0 ? '5. Ring Settled:' : '5. Bottleneck Settlement Complete:';
        narrative = `The preimage was revealed and ${formatLakhs(ring.active_extinguished_inr)} settled in the simulation.`
          + (ring.active_residual_inr > 0 ? ` ${formatLakhs(ring.active_residual_inr)} remains payable.` : '')
          + ' Open GST & KFS for receipts.';
        nextBtnLabel = 'New Run ↺';
      }

      bannerEl.innerHTML = `
        <div class="phase-story mx-3 mt-2 px-3 py-2 surface-card flex items-center justify-between gap-2 text-[12px]">
          <div class="flex items-center gap-2.5 min-w-0">
            <span class="px-2.5 py-0.5 font-mono text-[10.5px] whitespace-nowrap ${badgeCls}">${badgeText}</span>
            <p class="leading-snug text-theme-secondary">
              <strong class="text-theme-main font-extrabold">${headline}</strong> ${narrative}
            </p>
          </div>
          <button type="button" id="btn-banner-next"
            class="tactile-btn px-3 py-1 pill-sky text-[11px] whitespace-nowrap shrink-0">
            ${nextBtnLabel}
          </button>
        </div>
      `;

      bannerEl.querySelector('#btn-banner-next')?.addEventListener('click', () => {
        if (this.fsm.phase === 5 || this.fsm.rollbackCompleted) {
          this.fsm.reset(this.graphEval);
        } else {
          this.fsm.stepForward(this.graphEval);
        }
      });
    }

    renderLeftPanel() {
      const btnDelta = document.getElementById('mode-delta-bridge');
      const btnBottle = document.getElementById('mode-bottleneck');
      if (btnDelta && btnBottle) {
        const isDelta = this.clearanceMode === 'FULL_RING_DELTA_BRIDGE';
        btnDelta.className = `flex-1 py-1.5 px-2 text-[11px] tactile-btn ${
          isDelta ? 'pill-delta' : 'surface-card-alt text-theme-muted'
        }`;
        btnBottle.className = `flex-1 py-1.5 px-2 text-[11px] tactile-btn ${
          !isDelta ? 'pill-sky' : 'surface-card-alt text-theme-muted'
        }`;
      }

      const cycleSelectorWrap = document.getElementById('multi-cycle-selector-wrap');
      if (cycleSelectorWrap) {
        if (this.graphEval.rings.length > 1) {
          cycleSelectorWrap.classList.remove('hidden');
          cycleSelectorWrap.innerHTML = `
            <div class="flex items-center justify-between text-[11px] font-mono surface-card-alt px-2.5 py-1.5 mt-2">
              <span class="text-theme-main font-bold">Active Ring:</span>
              <div class="flex gap-1.5">
                ${this.graphEval.rings
                  .map(
                    (r, idx) => `
                  <button type="button" data-select-ring="${idx}"
                    class="tactile-btn px-2 py-0.5 text-[10px] ${
                      idx === this.graphEval.selected_ring_index
                        ? 'pill-sky'
                        : 'surface-card-alt text-theme-muted'
                    }">
                    Ring #${idx + 1} (${r.hop_count}H)
                  </button>
                `
                  )
                  .join('')}
              </div>
            </div>
            ${this.graphEval.active_ring?.shared_edge_ids.length
              ? `<p class="mt-1.5 text-[10px] text-theme-secondary">Shared invoice: ${this.graphEval.active_ring.shared_edge_ids.map(escapeHtml).join(', ')}. Each ring runs as a separate scenario.</p>`
              : ''}
          `;
          cycleSelectorWrap.querySelectorAll('[data-select-ring]').forEach(b => {
            b.addEventListener('click', () => {
              const index = Number(b.getAttribute('data-select-ring'));
              if (index === this.graphEval.selected_ring_index) return;
              this.selectedCycleIndex = index;
              this.recomputeGraphAndSync(false);
            });
          });
        } else {
          cycleSelectorWrap.classList.add('hidden');
          cycleSelectorWrap.innerHTML = '';
        }
      }

      document.querySelectorAll('[data-inv-filter]').forEach(btn => {
        const f = btn.getAttribute('data-inv-filter');
        const active = f === this.invoiceFilter;
        btn.className = `tactile-btn px-2.5 py-0.5 font-mono text-[10.5px] ${
          active ? 'pill-sky' : 'surface-card-alt text-theme-secondary'
        }`;
      });

      const itcRiskEdges = this.graphEval.edges.filter(e => e.is_itc_risk);
      const summaryStrip = document.getElementById('left-tax-summary-strip');
      if (summaryStrip) {
        summaryStrip.innerHTML = `
          <div class="flex items-center justify-between text-[11px] font-mono">
            <span class="text-theme-secondary font-bold">TDS: <strong class="text-rose-700">-${formatINR(this.graphEval.telemetry.cluster_total_tds_inr)}</strong></span>
            <span class="px-2 py-0.5 pill-amber text-[10px]">
              ⚠ ${itcRiskEdges.length} IRNs ≥150d (${formatLakhs(this.graphEval.telemetry.cluster_itc_exposure_inr)} ITC)
            </span>
          </div>
        `;
      }

      const tbody = document.getElementById('erp-invoice-tbody');
      if (!tbody) return;

      let filteredEdges = this.graphEval.edges;
      if (this.invoiceFilter === 'ITC_RISK') {
        filteredEdges = filteredEdges.filter(e => e.is_itc_risk);
      } else if (this.invoiceFilter === 'RING_ONLY') {
        filteredEdges = filteredEdges.filter(e => e.in_active_ring);
      }

      const maxPayable = Math.max(
        1,
        ...this.graphEval.edges.map(e => e.net_payable_inr)
      );

      const nodeMap = {};
      this.graphEval.nodes.forEach(n => {
        nodeMap[n.id] = n;
      });

      tbody.innerHTML = filteredEdges
        .map(edge => {
          const u = nodeMap[edge.from];
          const v = nodeMap[edge.to];
          const uLabel = u ? u.short_label.replace('MSME-', '') : edge.from;
          const vLabel = v ? v.short_label.replace('MSME-', '') : edge.to;

          const isRingDone =
            edge.in_active_ring &&
            this.fsm.phase === 5 &&
            !this.fsm.faultTriggered;
          const isDeltaMode = this.clearanceMode === 'FULL_RING_DELTA_BRIDGE';
          const isFullyPaid =
            isRingDone && (isDeltaMode || edge.is_bottleneck_edge);
          const isPartiallyPaid =
            isRingDone && !isDeltaMode && !edge.is_bottleneck_edge;

          const barPct = Math.max(15, Math.round((edge.net_payable_inr / maxPayable) * 100));

          return `
            <tr data-table-edge-id="${edge.id}"
              class="invoice-row font-mono text-[11px] cursor-pointer ${
                edge.in_active_ring ? '' : 'opacity-70'
              }">
              <td class="py-2 pl-2.5 pr-1 truncate">
                <div class="flex items-center gap-1.5">
                  <span class="font-extrabold text-theme-main">${escapeHtml(edge.irn_hash)}</span>
                  ${
                    edge.in_active_ring
                      ? `<span class="px-1.5 py-0.2 text-[9px] pill-sky">H${edge.hop_info.hop}</span>`
                      : `<span class="px-1.5 py-0.2 text-[9px] surface-card-alt text-theme-muted font-bold">SPK</span>`
                  }
                </div>
                <div class="text-[10px] text-theme-secondary font-semibold truncate mt-0.5">${uLabel} ➔ ${vLabel} • HSN ${escapeHtml(edge.hsn)}</div>
              </td>
              <td class="py-2 px-1 text-right">
                <div class="text-theme-main font-extrabold">${formatLakhs(edge.net_payable_inr)}</div>
                <div class="w-full h-1.5 bg-black/10 rounded-full overflow-hidden mt-1 border border-black/20">
                  <div class="h-full ${edge.in_active_ring ? 'bg-[#2D6CDF]' : 'bg-slate-500'}" style="width: ${barPct}%"></div>
                </div>
                <div class="text-[9px] text-theme-muted font-semibold mt-0.5">
                  TDS -${formatINR(edge.tds_deduction_inr)}
                </div>
              </td>
              <td class="py-2 px-1 text-center">
                ${
                  isFullyPaid
                    ? `<span class="inline-block px-1.5 py-0.5 text-[9.5px] pill-cr">PAID ✓</span>`
                    : isPartiallyPaid
                    ? `<span class="inline-block px-1.5 py-0.5 text-[9.5px] pill-sky" title="Mode 1 Partial Clearance: Settled f_min, residual ${formatINR(edge.hop_info ? edge.hop_info.residual_unsettled_inr : 0)} remains">PART</span>`
                    : edge.is_itc_risk
                    ? `<span class="inline-block px-1.5 py-0.5 text-[9.5px] pill-amber" title="CGST Sec 16(2): ${edge.days_to_180_cliff} days left before mandatory 18% ITC reversal">${edge.invoice_age_days}d ⚠</span>`
                    : `<span class="inline-block px-1.5 py-0.5 text-[9.5px] surface-card-alt font-bold">${edge.invoice_age_days}d</span>`
                }
              </td>
              <td class="py-2 pr-2 pl-0.5 text-right whitespace-nowrap">
                <button type="button" data-edit-inv="${edge.id}" class="text-theme-secondary hover:text-blue-700 px-1 py-0.5 font-bold border-none text-xs" title="Edit Invoice" aria-label="Edit invoice">✎</button>
                <button type="button" data-del-inv="${edge.id}" class="text-theme-secondary hover:text-red-700 px-1 py-0.5 font-bold border-none text-xs" title="Delete Invoice" aria-label="Delete invoice">✕</button>
              </td>
            </tr>
          `;
        })
        .join('');

      tbody.querySelectorAll('tr[data-table-edge-id]').forEach(row => {
        const edgeId = row.getAttribute('data-table-edge-id');
        row.addEventListener('click', e => {
          if (e.target.closest('button')) return;
          this.graphRenderer.selectEntity('EDGE', edgeId);
        });
        row.addEventListener('mouseenter', () => {
          this.graphRenderer.setHoveredEntity('EDGE', edgeId, true);
          this._syncExternalHoverState('EDGE', edgeId);
        });
        row.addEventListener('mouseleave', () => {
          this.graphRenderer.setHoveredEntity(null, null, true);
          this._syncExternalHoverState(null, null);
        });
      });

    _initTimelineResizeDrag() {
      const handle = document.getElementById('timeline-resize-handle');
      const listEl = document.getElementById('timeline-log-list');
      if (!handle || !listEl) return;

      let isDragging = false;
      let startY = 0;
      let startHeight = this.timelineHeightPx;

      const onMove = clientY => {
        if (!isDragging) return;
        const deltaY = startY - clientY; // dragging up increases height
        const nextHeight = Math.min(420, Math.max(48, startHeight + deltaY));
        this.timelineHeightPx = nextHeight;
        if (this.timelineCollapsed && deltaY > 10) {
          this.timelineCollapsed = false;
          this.renderTimeline();
        }
        listEl.style.height = `${this.timelineHeightPx}px`;
        listEl.style.maxHeight = `${this.timelineHeightPx}px`;
      };

      handle.addEventListener('mousedown', e => {
        isDragging = true;
        startY = e.clientY;
        startHeight = this.timelineCollapsed ? 0 : (listEl.offsetHeight || this.timelineHeightPx);
        handle.classList.add('is-dragging');
        document.body.style.userSelect = 'none';
        e.preventDefault();
      });

      window.addEventListener('mousemove', e => {
        if (isDragging) onMove(e.clientY);
      });

      window.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          handle.classList.remove('is-dragging');
          document.body.style.userSelect = '';
        }
      });

      handle.addEventListener('touchstart', e => {
        if (!e.touches.length) return;
        isDragging = true;
        startY = e.touches[0].clientY;
        startHeight = this.timelineCollapsed ? 0 : (listEl.offsetHeight || this.timelineHeightPx);
        handle.classList.add('is-dragging');
      }, { passive: true });

      window.addEventListener('touchmove', e => {
        if (isDragging && e.touches.length) {
          onMove(e.touches[0].clientY);
        }
      }, { passive: true });

      window.addEventListener('touchend', () => {
        if (isDragging) {
          isDragging = false;
          handle.classList.remove('is-dragging');
        }
      });
    }

    _animateMetricCounters(container) {
      container.querySelectorAll('[data-animate-num]').forEach(el => {
        const key = el.getAttribute('data-animate-key') || 'kpi';
        const target = parseFloat(el.getAttribute('data-animate-num') || '0');
        const decimals = parseInt(el.getAttribute('data-animate-decimals') || '2', 10);
        const prefix = el.getAttribute('data-animate-prefix') || '';
        const suffix = el.getAttribute('data-animate-suffix') || '';

        const startVal =
          typeof this.prevKpiValues[key] === 'number' ? this.prevKpiValues[key] : target;
        this.prevKpiValues[key] = target;

        if (Math.abs(target - startVal) < 0.01) {
          el.textContent = `${prefix}${target.toFixed(decimals)}${suffix}`;
          return;
        }

        const duration = 380;
        const startTime = performance.now();
        const step = now => {
          const t = Math.min(1, (now - startTime) / duration);
          const eased = 1 - Math.pow(1 - t, 3);
          const current = startVal + (target - startVal) * eased;
          el.textContent = `${prefix}${current.toFixed(decimals)}${suffix}`;
          if (t < 1) {
            requestAnimationFrame(step);
          }
        };
        requestAnimationFrame(step);
      });
    }

            <div class="w-full h-3 bg-black/10 rounded-md overflow-hidden flex border border-[#1E2430]">
              <div class="bg-[#DFBAEE] h-full border-r border-[#1E2430]" style="width: ${bridgeSharePct}%"></div>
              <div class="bg-[#74B9FF] h-full" style="width: ${seedSharePct}%"></div>
            </div>

            <div class="pt-1 border-t border-theme space-y-1">
              <div class="flex items-center justify-between text-[10px] font-bold">
                <span class="text-theme-secondary">HTLC Hop Pointer (${this.fsm.currentHopIndex}/${ring.hop_count})</span>
                <span class="text-theme-main">Timelock SLA: 1500ms</span>
              </div>
              <div class="w-full h-2.5 bg-black/10 rounded-md overflow-hidden border border-[#1E2430]">
                <div class="h-full ${
                  this.fsm.faultTriggered ? 'bg-[#F29B76]' : 'bg-[#9ED29E]'
                } transition-all" style="width: ${hopProgressPct}%"></div>
              </div>
            </div>
          </div>

          <!-- Cryptographic HTLC & SGX Enclave Attestation Card -->
          <div class="p-3 surface-card space-y-1.5 text-[10.5px]">
            <div class="flex items-center justify-between">
              <span class="text-theme-secondary font-bold">Issuer CBDC Switch:</span>
              <span class="px-2 py-0.5 pill-delta text-[9.5px]">${tokenPayload.token_header.issuer_bank_ifsc}</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-theme-secondary font-bold">SGX Preimage Status:</span>
              ${
                preimageVerified
                  ? `<span class="px-2 py-0.5 pill-cr text-[9.5px]">REVEALED ✓ (${escapeHtml(ring.crypto.preimage_raw)})</span>`
                  : this.fsm.faultTriggered
                  ? `<span class="px-2 py-0.5 pill-dr text-[9.5px]">WITHHELD (TIMEOUT)</span>`
                  : `<span class="px-2 py-0.5 pill-amber text-[9.5px]">SEALED IN SGX 🔒</span>`
              }
            </div>
            <div class="pt-1 border-t border-theme">
              <div class="text-theme-secondary font-bold text-[9.5px]">HTLC Hashlock (SHA-256):</div>
              <div class="text-theme-main font-bold text-[9px] break-all surface-card-alt p-1.5 rounded mt-1 select-all">
                ${ring.crypto.hash_lock_sha256}
              </div>
            </div>
          </div>

          <!-- Collapsible & Copyable Programmable e₹ Token JSON Payload -->
          <div class="surface-card overflow-hidden">
            <div class="px-3 py-2 surface-card-alt border-b-2 border-ink flex items-center justify-between text-[10.5px]">
              <button type="button" id="btn-toggle-json-drawer" class="font-extrabold text-theme-main hover:underline flex items-center gap-1 border-none">
                <span>${this.jsonDrawerExpanded ? '▼' : '▶'}</span>
                <span>WRAPPED e₹ CBDC PAYLOAD (JSON)</span>
              </button>
              <button type="button" id="btn-copy-json-payload"
                class="tactile-btn px-2.5 py-0.5 pill-sky text-[9.5px]">
                ⧉ Copy JSON
              </button>
            </div>
            <div id="json-drawer-body" class="${this.jsonDrawerExpanded ? '' : 'hidden'} bg-[#101C33] text-emerald-300">
              <pre class="cbdc-json-pre p-3 text-[9.5px] leading-[1.35] select-all">${this._syntaxHighlightJson(
                jsonPretty
              )}</pre>
            </div>
          </div>
        </div>
      `;
    }

    _bindTab2Events(ring) {
      const toggleBtn = document.getElementById('btn-toggle-json-drawer');
      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          this.jsonDrawerExpanded = !this.jsonDrawerExpanded;
          this.renderRightPanel();
        });
      }

      const copyBtn = document.getElementById('btn-copy-json-payload');
      if (copyBtn) {
        copyBtn.addEventListener('click', () => {
          const payload = this.graphEval.buildTokenPayload(
            this.fsm.currentHopIndex,
            this.fsm.phase,
            this.fsm.faultTriggered,
            this.fsm.rollbackCompleted
          );
          this._copyTextToClipboard(
            JSON.stringify(payload, null, 2),
            `Copied ${ring.crypto.rbi_serial_id} JSON payload!`
          );
        });
      }
    }

    _renderTab3StatutoryLedger(ring, tel) {
      const nbfc = this.graphEval.partner_nbfc;
      const isSettled = this.fsm.phase === 5 && !this.fsm.faultTriggered;
      const isDelta = this.clearanceMode === 'FULL_RING_DELTA_BRIDGE';

      return `
        <div class="p-3 space-y-3 font-mono">
          <!-- Statutory Compliance Banner -->
          <div class="p-2.5 ${
            isSettled
              ? 'pill-cr'
              : this.fsm.faultTriggered
              ? 'pill-dr'
              : 'surface-card'
          } text-[10.5px]">
            <div class="font-extrabold flex items-center justify-between">
              <span>CGST SEC 16(2) &amp; IT SEC 194Q/194C</span>
              <span>${
                isSettled
                  ? isDelta
                    ? '100% SETTLED ✓'
                    : `BOTTLENECK SETTLED (${ring.bottleneck_coverage_pct.toFixed(1)}%)`
                  : 'PROVISIONAL'
              }</span>
            </div>
            <div class="text-[9.5px] font-semibold mt-1">
              Each completed hop generates a simulated CBDC UTR.
            </div>
          </div>

          <!-- Hop-by-Hop CBDC UTR & Sec 16(2) ITC Protection Certificates -->
          <div class="space-y-2">
            ${ring.ordered_path_vector
              .map((hop, idx) => {
                const receipt = ring.crypto.hop_receipts[idx];
                const hopState = this.fsm.hopStates[idx] || 'PENDING';
                const hopDone = hopState === 'SETTLED';
                const receiptStatus = { LOCKED: 'PROVISIONAL LOCK', FAULTED: 'SWITCH TIMEOUT', ROLLED_BACK: 'REVERTED' };

                return `
                  <div class="p-2.5 surface-card text-[10px]">
                    <div class="flex items-center justify-between font-extrabold">
                      <span class="text-theme-main">HOP ${hop.hop} • ${escapeHtml(hop.irn_hash)} (HSN ${escapeHtml(hop.hsn)})</span>
                      <span class="px-2 py-0.5 pill-cr text-[9.5px]">${formatINR(hop.settle_amount_inr)}</span>
                    </div>
                    <div class="flex items-center justify-between text-[9.5px] text-theme-secondary font-semibold mt-1">
                      <span>${hop.from_vpa} ➔ ${hop.to_vpa}</span>
                      <span>TDS: -${formatINR(hop.tds_deducted_inr)}${
                  hop.residual_unsettled_inr > 0
                    ? ` • Res: ${formatLakhs(hop.residual_unsettled_inr)}`
                    : ''
                }</span>
                    </div>
                    <div class="mt-1.5 pt-1.5 border-t border-theme flex items-center justify-between gap-1 text-[9.5px]">
                      <span class="text-theme-secondary font-bold">
                        UTR: <strong class="${hopDone ? 'text-emerald-800' : 'text-theme-muted'}">${
                  hopDone ? receipt.utr_number : (receiptStatus[hopState] || 'PENDING')
                }</strong>
                      </span>
                      ${
                        hop.is_itc_risk
                          ? `<span class="px-2 py-0.5 ${
                              isSettled ? 'pill-cr' : 'pill-amber'
                            } text-[9px] whitespace-nowrap">
                              ${
                                isSettled
                                  ? isDelta || hop.residual_unsettled_inr === 0
                                    ? 'SEC 16(2) CERTIFIED ✓'
                                    : 'PARTIAL UTR ISSUED'
                                  : `⚠ 16(2) RISK (${hop.invoice_age_days}d)`
                              }
                            </span>`
                          : `<span class="text-theme-muted font-bold whitespace-nowrap">ITC Safe (${hop.invoice_age_days}d)</span>`
                      }
                    </div>
                  </div>
                `;
              })
              .join('')}
          </div>

          <!-- Automated RBI Digital Lending Key Facts Statement (KFS) -->
          <div class="p-3 surface-card text-[10px] space-y-2">
            <div class="flex items-center justify-between border-b-2 border-ink pb-1.5">
              <span class="font-extrabold text-theme-main">${
                isDelta ? 'RBI DIGITAL LENDING KFS' : 'MODE 1 FLASH SEED STATEMENT'
              }</span>
              <button type="button" id="btn-copy-kfs"
                class="tactile-btn px-2 py-0.5 pill-delta text-[9px]">
                ⧉ Copy KFS
              </button>
            </div>
            <div class="grid grid-cols-2 gap-x-2 gap-y-1 text-[9.5px]">
              <span class="text-theme-secondary font-semibold">Regulated Entity (RE):</span>
              <span class="text-right text-theme-main font-extrabold">${nbfc.name}</span>
              <span class="text-theme-secondary font-semibold">RBI CoR / Switch IFSC:</span>
              <span class="text-right text-theme-main font-bold">${nbfc.rbi_cor_no} (${nbfc.issuer_bank_ifsc})</span>
              <span class="text-theme-secondary font-semibold">${
                isDelta ? 'Total Delta-Bridge (L_bridge):' : 'External Credit Disbursed:'
              }</span>
              <span class="text-right text-theme-main font-extrabold">${
                isDelta ? formatINR(ring.l_bridge_inr) : '₹0 (Zero Credit)'
              }</span>
              <span class="text-theme-secondary font-semibold">${
                isDelta ? 'All-In APR / Tenure:' : 'Flash Carrier Seed (f_min):'
              }</span>
              <span class="text-right text-theme-main font-bold">${
                isDelta
                  ? `${nbfc.apr_percent}% p.a. (${nbfc.bridge_tenure_days} Days)`
                  : `${formatINR(ring.f_min_inr)} (Intra-Block Loop)`
              }</span>
              <span class="text-theme-secondary font-semibold">${
                isDelta ? 'Bridge Interest + Flash Fee:' : 'Platform Flash Fee Only:'
              }</span>
              <span class="text-right text-emerald-800 font-extrabold">${formatINR(tel.total_chakrika_cost_inr)}</span>
              <span class="text-theme-secondary font-semibold">Disbursement Rail:</span>
              <span class="text-right text-blue-800 font-extrabold">Direct-to-MSME CBDC VPA</span>
            </div>
          </div>
        </div>
      `;
    }

    _bindTab3Events(ring, tel) {
      const copyKfsBtn = document.getElementById('btn-copy-kfs');
      if (copyKfsBtn) {
        copyKfsBtn.addEventListener('click', () => {
          const nbfc = this.graphEval.partner_nbfc;
          const isDelta = this.clearanceMode === 'FULL_RING_DELTA_BRIDGE';
          const summary = [
            `CHAKRIKA — SIMULATED ${isDelta ? 'DIGITAL LENDING KEY FACTS STATEMENT' : 'FLASH SEED STATEMENT'} (${ring.ring_id})`,
            `Regulated Entity (RE): ${nbfc.name} (${nbfc.rbi_cor_no})`,
            `Issuer CBDC Switch IFSC: ${nbfc.issuer_bank_ifsc}`,
            `Gross Ring Payables Extinguished: ${formatINR(ring.active_extinguished_inr)}`,
            ...(isDelta ? [
              `Total NBFC Delta-Bridge: ${formatINR(ring.l_bridge_inr)}`,
              `All-In APR & Tenure: ${nbfc.apr_percent}% p.a. (${nbfc.bridge_tenure_days} Days)`
            ] : [
              'External credit: ₹0',
              `Flash Carrier Seed: ${formatINR(ring.f_min_inr)}`,
              `Residual payables: ${formatINR(ring.active_residual_inr)}`
            ]),
            `Total simulated cost: ${formatINR(tel.total_chakrika_cost_inr)}`
          ].join('\n');
          this._copyTextToClipboard(summary, 'Copied simulation statement.');
        });
      }
    }

    _syntaxHighlightJson(jsonStr) {
      return jsonStr
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(
          /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
          match => {
            let cls = 'text-amber-300';
            if (/^"/.test(match)) {
              if (/:$/.test(match)) {
                cls = 'text-sky-300 font-semibold';
              } else {
                cls = 'text-emerald-300';
              }
            } else if (/true|false/.test(match)) {
              cls = 'text-purple-300 font-bold';
            }
            return `<span class="${cls}">${match}</span>`;
          }
        );
    }

    _highlightSelectedEntityInTables(type, id) {
      document.querySelectorAll('tr[data-table-edge-id]').forEach(row => {
        if (type === 'EDGE' && row.getAttribute('data-table-edge-id') === id) {
          row.classList.add('is-selected-row');
          row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        } else {
          row.classList.remove('is-selected-row');
        }
      });
    }

    openInvoiceModal(invoiceId = null) {
      const modal = document.getElementById('invoice-crud-modal');
      if (!modal) return;

      const errBanner = document.getElementById('modal-validation-error');
      if (errBanner) errBanner.classList.add('hidden');

      this.editingInvoiceId = invoiceId;
      const titleEl = document.getElementById('invoice-modal-title');
      const fromSel = document.getElementById('modal-inv-from');
      const toSel = document.getElementById('modal-inv-to');
      const irnInput = document.getElementById('modal-inv-irn');
      const hsnInput = document.getElementById('modal-inv-hsn');
      const descInput = document.getElementById('modal-inv-desc');
      const grossInput = document.getElementById('modal-inv-gross');
      const tdsSel = document.getElementById('modal-inv-tds');
      const ageInput = document.getElementById('modal-inv-age');

      const nodeOptionsHtml = this.cluster.nodes
        .map(n => `<option value="${n.id}">${n.short_label} — ${n.name} (${n.bank})</option>`)
        .join('');
      fromSel.innerHTML = nodeOptionsHtml;
      toSel.innerHTML = nodeOptionsHtml;

      if (invoiceId) {
        const existing = this.cluster.invoices.find(i => i.id === invoiceId);
        if (existing) {
          titleEl.textContent = `Edit GSTN e-Invoice (${existing.irn_hash})`;
          fromSel.value = existing.from;
          toSel.value = existing.to;
          irnInput.value = existing.irn_hash;
          hsnInput.value = existing.hsn;
          descInput.value = existing.description || '';
          grossInput.value = existing.gross_amount_inr;
          tdsSel.value = existing.tds_section || '194Q';
          ageInput.value = existing.invoice_age_days;
        }
      } else {
        titleEl.textContent = 'Add Verified GSTN IRP e-Invoice';
        const nextNum = 500 + this.cluster.invoices.length * 17;
        fromSel.value = this.cluster.nodes[0]?.id || '';
        toSel.value = this.cluster.nodes[1]?.id || '';
        irnInput.value = `IRN-${nextNum}`;
        hsnInput.value = '8466';
        descInput.value = 'Precision Machined B2B Industrial Sub-Assembly';
        grossInput.value = 850850;
        tdsSel.value = '194Q';
        ageInput.value = 158;
      }

      modal.classList.remove('hidden');
    }

    closeInvoiceModal() {
      const modal = document.getElementById('invoice-crud-modal');
      if (modal) modal.classList.add('hidden');
      this.editingInvoiceId = null;
    }

    saveInvoiceFromModal() {
      const fromId = document.getElementById('modal-inv-from').value;
      const toId = document.getElementById('modal-inv-to').value;
      const errBanner = document.getElementById('modal-validation-error');

      if (fromId === toId) {
        if (errBanner) {
          errBanner.textContent = 'Buyer (From) and Supplier (To) must be distinct MSME entities.';
          errBanner.classList.remove('hidden');
        }
        return;
      }

      const irnHash = (document.getElementById('modal-inv-irn').value || 'IRN-999').trim();
      const hsn = (document.getElementById('modal-inv-hsn').value || '8466').trim();
      const description = (document.getElementById('modal-inv-desc').value || 'B2B Supply').trim();
      const gross = Math.max(1000, Math.round(Number(document.getElementById('modal-inv-gross').value) || 500000));
      const tdsSection = document.getElementById('modal-inv-tds').value;
      const ageDays = Math.max(1, Math.min(365, Math.round(Number(document.getElementById('modal-inv-age').value) || 90)));

      const tdsMeta = Data.TDS_SECTIONS[tdsSection] || Data.TDS_SECTIONS['194Q'];
      const existingInv = this.editingInvoiceId
        ? this.cluster.invoices.find(i => i.id === this.editingInvoiceId)
        : null;
      const tdsDeduction =
        existingInv &&
        existingInv.gross_amount_inr === gross &&
        existingInv.tds_section === tdsSection
          ? existingInv.tds_deduction_inr
          : Math.round((gross / (1 + tdsMeta.rate)) * tdsMeta.rate);
      const netPayable = gross - tdsDeduction;
      const gstIncluded = Math.round(gross - gross / 1.18);

      if (this.editingInvoiceId) {
        const idx = this.cluster.invoices.findIndex(i => i.id === this.editingInvoiceId);
        if (idx !== -1) {
          this.cluster.invoices[idx] = {
            ...this.cluster.invoices[idx],
            irn_hash: irnHash,
            from: fromId,
            to: toId,
            hsn,
            description,
            gross_amount_inr: gross,
            gst_included_inr: gstIncluded,
            tds_section: tdsSection,
            tds_rate: tdsMeta.rate,
            tds_deduction_inr: tdsDeduction,
            net_payable_inr: netPayable,
            invoice_age_days: ageDays
          };
        }
        this.showToast(`Updated invoice ${irnHash} & recomputed SGX graph`, 'success');
      } else {
        let sequence = 1;
        while (this.cluster.invoices.some(invoice => invoice.id === `IRN-LIVE-${sequence}`)) sequence++;
        const newId = `IRN-LIVE-${sequence}`;
        this.cluster.invoices.push({
          id: newId,
          irn_hash: irnHash,
          from: fromId,
          to: toId,
          hsn,
          description,
          gross_amount_inr: gross,
          gst_included_inr: gstIncluded,
          tds_section: tdsSection,
          tds_rate: tdsMeta.rate,
          tds_deduction_inr: tdsDeduction,
          net_payable_inr: netPayable,
          invoice_age_days: ageDays,
          erp_voucher: 'ERP/LIVE/ADD'
        });
        this.showToast(`Added invoice ${irnHash} & recomputed SGX graph`, 'success');
      }

      this.closeInvoiceModal();
      this.recomputeGraphAndSync(false);
    }

    deleteInvoice(invoiceId) {
      const target = this.cluster.invoices.find(i => i.id === invoiceId);
      this.cluster.invoices = this.cluster.invoices.filter(i => i.id !== invoiceId);
      if (target) {
        this.showToast(`Removed ${target.irn_hash} from cluster ledger`, 'info');
      }
      this.recomputeGraphAndSync(false);
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    const app = new ChakrikaWorkbenchApp();
    app.init();
    global.Chakrika.AppInstance = app;
  });
})(window);
  </script>
</body>
