  <!-- Illustrated Blueprint & Warm Parchment Stylesheet -->
  <style>
/**
 * CHAKRIKA — ILLUSTRATED BLUEPRINT & WARM PARCHMENT WORKBENCH STYLESHEET
 * Matches the Neo-Brutalist Storyboard Infographic aesthetic:
 *   - Deep Navy Blueprint Canvas (#15233E)
 *   - Warm Cream Parchment Cards (#FDF3DC / #FFFBF0)
 *   - Bold Ink Outlines (2px solid #1E2430) & Tactile Offset Shadows (3px 4px 0px #0B1324)
 *   - Pastel Coral (#F29B76), Sage (#9ED29E), Lavender (#DFBAEE), Sky (#74B9FF) & Amber (#F8CB66) Accents
 * Also includes a 1-click toggle for [data-theme="dark"] (Classic Dark Terminal Mode).
 */

:root,
html[data-theme="light"],
html[data-theme="illustrated"] {
  --bg-app: #15233E;
  --bg-header: #101C33;
  --bg-subheader: #182949;
  --bg-panel: #F6EBD3;
  --bg-panel-header: #EFE0C2;
  --bg-card: #FDF4E1;
  --bg-card-alt: #F4E6C8;
  --bg-card-hover: #FFFDF7;
  --bg-input: #FFFDF7;
  --border-ink: #1E2430;
  --border-subtle: #C8B796;
  --border-strong: #1E2430;
  --border-highlight: #2D6CDF;
  --text-main: #1E2430;
  --text-secondary: #2D3748;
  --text-muted: #5A6578;
  --text-dim: #718096;
  --canvas-bg: #15233E;
  --shadow-tactile: 3px 4px 0px #0B1324;
  --shadow-tactile-sm: 2px 2px 0px #1E2430;
  --shadow-card: 2px 3px 0px rgba(30, 36, 48, 0.85);
  --pill-coral-bg: #F29B76;
  --pill-coral-text: #1E2430;
  --pill-sage-bg: #9ED29E;
  --pill-sage-text: #1E2430;
  --pill-lavender-bg: #DFBAEE;
  --pill-lavender-text: #1E2430;
  --pill-sky-bg: #74B9FF;
  --pill-sky-text: #1E2430;
  --pill-amber-bg: #F8CB66;
  --pill-amber-text: #1E2430;
  --scrollbar-track: #EFE0C2;
  --scrollbar-thumb: #B5A27F;
}

html[data-theme="dark"] {
  --bg-app: #080E1A;
  --bg-header: #0B1222;
  --bg-subheader: #0F172A;
  --bg-panel: #0F172A;
  --bg-panel-header: #131D33;
  --bg-card: #18243C;
  --bg-card-alt: #111A2E;
  --bg-card-hover: #1E2D4A;
  --bg-input: #0D1526;
  --border-ink: #050911;
  --border-subtle: #263554;
  --border-strong: #3B527E;
  --border-highlight: #38BDF8;
  --text-main: #F8FAFC;
  --text-secondary: #E2E8F0;
  --text-muted: #94A3B8;
  --text-dim: #64748B;
  --canvas-bg: #0D172A;
  --shadow-tactile: 3px 4px 0px #04070E;
  --shadow-tactile-sm: 2px 2px 0px #04070E;
  --shadow-card: 2px 3px 0px #04070E;
  --pill-coral-bg: #F29B76;
  --pill-coral-text: #1E2430;
  --pill-sage-bg: #9ED29E;
  --pill-sage-text: #1E2430;
  --pill-lavender-bg: #DFBAEE;
  --pill-lavender-text: #1E2430;
  --pill-sky-bg: #74B9FF;
  --pill-sky-text: #1E2430;
  --pill-amber-bg: #F8CB66;
  --pill-amber-text: #1E2430;
  --scrollbar-track: #0F172A;
  --scrollbar-thumb: #334155;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: var(--bg-app);
  color: var(--text-main);
  font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 13px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}

.font-mono {
  font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
  font-variant-numeric: tabular-nums;
}

/* Workbench Root Structure */
.workbench-root {
  display: flex;
  flex-direction: column;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background-color: var(--bg-app);
}

/* Top Header Bar — Deep Navy Blueprint Frame with Tactile Parchment Controls */
.workbench-header {
  background-color: var(--bg-header);
  border-bottom: 2px solid #0B1324;
  display: flex;
  flex-direction: column;
  z-index: 30;
  flex-shrink: 0;
}

.header-top-row {
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 14px;
  gap: 10px;
  border-bottom: 1.5px solid #243861;
  flex-wrap: wrap;
}

.header-stepper-row {
  min-height: 44px;
  display: flex;
  align-items: center;
  padding: 5px 14px;
  background-color: var(--bg-subheader);
}

.workbench-columns {
  flex: 1;
  min-height: 0;
  display: flex;
  width: 100%;
  overflow: hidden;
}

.panel-left {
  width: 25.5%;
  min-width: 285px;
  max-width: 395px;
  height: 100%;
  background-color: var(--bg-panel);
  border-right: 2.5px solid var(--border-ink);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.panel-center {
  width: 45.5%;
  flex: 1;
  min-width: 0;
  height: 100%;
  background-color: var(--canvas-bg);
  background-image: radial-gradient(circle at 50% 48%, #213760 0%, #14223D 70%, #0E192E 100%);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

.panel-right {
  width: 29%;
  min-width: 320px;
  max-width: 475px;
  height: 100%;
  background-color: var(--bg-panel);
  border-left: 2.5px solid var(--border-ink);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

@media (max-width: 1023px) {
  html, body, .workbench-root {
    height: auto;
    min-height: 100vh;
    overflow-y: auto;
  }
  .workbench-columns {
    flex-direction: column;
    overflow: visible;
  }
  .panel-left, .panel-center, .panel-right {
    width: 100%;
    max-width: none;
    min-width: 0;
    height: auto;
    border-right: none;
    border-left: none;
    border-bottom: 2.5px solid var(--border-ink);
  }
  .panel-center {
    min-height: 540px;
  }
}

/* Tactile Neo-Brutalist Parchment Cards & Buttons */
.surface-card {
  background-color: var(--bg-card);
  border: 2px solid var(--border-strong);
  border-radius: 12px;
  box-shadow: var(--shadow-card);
  color: var(--text-main);
}

.surface-card-alt {
  background-color: var(--bg-card-alt);
  border: 1.5px solid var(--border-strong);
  border-radius: 9px;
  color: var(--text-main);
}

.surface-input {
  background-color: var(--bg-input);
  border: 2px solid var(--border-strong);
  color: var(--text-main);
  border-radius: 8px;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.06);
  font-weight: 600;
}

.surface-input:focus {
  outline: none;
  border-color: var(--border-highlight);
}

.tactile-btn {
  border: 2px solid #1E2430 !important;
  border-radius: 8px !important;
  box-shadow: 2px 3px 0px #0B1324;
  font-weight: 700 !important;
  transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.12s ease;
}

.tactile-btn:hover {
  transform: translate(-1px, -1px);
  box-shadow: 3px 4px 0px #0B1324;
}

.tactile-btn:active {
  transform: translate(1px, 1px);
  box-shadow: 1px 1px 0px #0B1324;
}

/* Illustrated Pill Badges Matching Reference Image */
.pill-dr {
  background-color: var(--pill-coral-bg);
  color: var(--pill-coral-text);
  border: 1.8px solid #1E2430;
  border-radius: 7px;
  font-weight: 800;
}

.pill-cr {
  background-color: var(--pill-sage-bg);
  color: var(--pill-sage-text);
  border: 1.8px solid #1E2430;
  border-radius: 7px;
  font-weight: 800;
}

.pill-delta {
  background-color: var(--pill-lavender-bg);
  color: var(--pill-lavender-text);
  border: 1.8px solid #1E2430;
  border-radius: 7px;
  font-weight: 800;
}

.pill-sky {
  background-color: var(--pill-sky-bg);
  color: var(--pill-sky-text);
  border: 1.8px solid #1E2430;
  border-radius: 7px;
  font-weight: 800;
}

.pill-amber {
  background-color: var(--pill-amber-bg);
  color: var(--pill-amber-text);
  border: 1.8px solid #1E2430;
  border-radius: 7px;
  font-weight: 800;
}

.text-theme-main { color: var(--text-main); }
.text-theme-secondary { color: var(--text-secondary); }
.text-theme-muted { color: var(--text-muted); }
.text-theme-dim { color: var(--text-dim); }
.border-theme { border-color: var(--border-subtle); }
.border-ink { border-color: var(--border-strong); }

/* 5-Phase Stepper Buttons */
#phase-stepper-container {
  display: flex;
  align-items: center;
  width: 100%;
  gap: 8px;
}

.phase-step-btn {
  flex: 1;
  justify-content: center;
  padding: 5px 8px;
  font-size: 11.5px;
  border-radius: 9px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  min-width: 0;
  font-weight: 700;
  border: 2px solid #1E2430;
  box-shadow: 2px 3px 0px #0B1324;
  transition: all 0.15s ease;
}

.phase-step-btn:hover {
  transform: translateY(-1px);
}

/* Right Panel Tab Buttons */
[data-right-tab] {
  flex: 1;
  min-width: 0;
  padding: 10px 6px;
  font-size: 11.5px;
  font-weight: 800;
  text-align: center;
  white-space: nowrap;
  border-top: none;
  border-left: none;
  border-right: 1.5px solid var(--border-subtle);
  transition: all 0.15s ease;
}

[data-right-tab]:last-child {
  border-right: none;
}

/* Invoice Table Fixed Layout & Hover Sync */
.invoice-table-fixed {
  width: 100%;
  table-layout: fixed;
  border-collapse: collapse;
}

.invoice-row {
  border-bottom: 1.5px solid var(--border-subtle);
  transition: background-color 0.15s ease, box-shadow 0.15s ease;
}

.invoice-row:hover,
.invoice-row.is-synced-hover {

/**
 * CHAKRIKA CRYPTOGRAPHIC & ATTESTATION ENGINE
 * Deterministic FIPS 180-4 SHA-256 implementation for Cross-Bank HTLC Hashlocks,
 * GSTN IRN Hashes, Intel SGX Enclave Attestation Quotes, and RBI e₹ CBDC UTRs.
 */
(function (global) {
  'use strict';

  const K = new Uint32Array([
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
  ]);

  function rotr(n, x) {
    return (x >>> n) | (x << (32 - n));
  }

  function sha256Hex(ascii) {
    const utf8 = unescape(encodeURIComponent(String(ascii)));
    const msgLen = utf8.length;
    const bitLen = msgLen * 8;

    const totalWords = (((msgLen + 8) >>> 6) + 1) * 16;
    const M = new Uint32Array(totalWords);

    for (let i = 0; i < msgLen; i++) {
      M[i >>> 2] |= (utf8.charCodeAt(i) & 0xff) << (24 - (i % 4) * 8);
    }
    M[msgLen >>> 2] |= 0x80 << (24 - (msgLen % 4) * 8);
    M[totalWords - 1] = bitLen >>> 0;
    M[totalWords - 2] = Math.floor(bitLen / 0x100000000);

    let H0 = 0x6a09e667;
    let H1 = 0xbb67ae85;
    let H2 = 0x3c6ef372;
    let H3 = 0xa54ff53a;
    let H4 = 0x510e527f;
    let H5 = 0x9b05688c;
    let H6 = 0x1f83d9ab;
    let H7 = 0x5be0cd19;

    const W = new Uint32Array(64);

    for (let offset = 0; offset < totalWords; offset += 16) {
      for (let t = 0; t < 16; t++) {
        W[t] = M[offset + t];
      }
      for (let t = 16; t < 64; t++) {
        const s0 = rotr(7, W[t - 15]) ^ rotr(18, W[t - 15]) ^ (W[t - 15] >>> 3);
        const s1 = rotr(17, W[t - 2]) ^ rotr(19, W[t - 2]) ^ (W[t - 2] >>> 10);
        W[t] = (W[t - 16] + s0 + W[t - 7] + s1) >>> 0;
      }

      let a = H0, b = H1, c = H2, d = H3, e = H4, f = H5, g = H6, h = H7;

      for (let t = 0; t < 64; t++) {
        const S1 = rotr(6, e) ^ rotr(11, e) ^ rotr(25, e);
        const ch = (e & f) ^ (~e & g);
        const temp1 = (h + S1 + ch + K[t] + W[t]) >>> 0;
        const S0 = rotr(2, a) ^ rotr(13, a) ^ rotr(22, a);
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const temp2 = (S0 + maj) >>> 0;

        h = g;
        g = f;
        f = e;
        e = (d + temp1) >>> 0;
        d = c;
        c = b;
        b = a;
        a = (temp1 + temp2) >>> 0;
      }

      H0 = (H0 + a) >>> 0;
      H1 = (H1 + b) >>> 0;
      H2 = (H2 + c) >>> 0;
      H3 = (H3 + d) >>> 0;
      H4 = (H4 + e) >>> 0;
      H5 = (H5 + f) >>> 0;
      H6 = (H6 + g) >>> 0;
      H7 = (H7 + h) >>> 0;
    }

    return [H0, H1, H2, H3, H4, H5, H6, H7]
      .map(v => v.toString(16).padStart(8, '0'))
      .join('');
  }

  /**
   * Generates full cryptographic metadata for a detected clearing ring
   */
  function generateRingCryptoBundle(ringId, hops, isDefaultPeenyaRing) {
    // For the canonical RING-PEENYA-094 default state, use the canonical preimage 'test'
    // which hashes to 0x9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
    // while dynamically hashing when edges or clusters change.
    const hopFingerprint = hops
      .map(h => `${h.from_vpa}->${h.to_vpa}:${h.irn_hash}:${h.settle_amount_inr}`)
      .join('|');

    const isCanonicalPeenya =
      ringId === 'RING-PEENYA-094' &&
      hops.length === 4 &&
      hops[0].settle_amount_inr === 1200000 &&
      hops[1].settle_amount_inr === 1000000 &&
      hops[2].settle_amount_inr === 1100000 &&
      hops[3].settle_amount_inr === 900000;

    const preimageRaw = isCanonicalPeenya
      ? 'test'
      : `CHAKRIKA_PREIMAGE::${ringId}::${hopFingerprint}`;

    const preimageDisplay = isCanonicalPeenya
      ? '0x74657374 (SGX-SEALED: CHAKRIKA-PEENYA-094-PREIMAGE)'
      : `0x${sha256Hex('SECRET_SEED::' + preimageRaw).slice(0, 32)}`;

    const hashLockHex = '0x' + sha256Hex(preimageRaw);
    const sgxMrEnclave = '0x' + sha256Hex(`INTEL_SGX_ENCLAVE_V2.4::${ringId}::TARJAN_JOHNSON`);
    const sgxQuoteHash = '0x' + sha256Hex(`SGX_DCAP_QUOTE::${ringId}::${hopFingerprint}`);

    const hopReceipts = hops.map((hop, idx) => {
      const utrSeed = `RBI_CBDC_UTR::${ringId}::HOP_${idx + 1}::${hop.irn_hash}::${hop.settle_amount_inr}`;
      const fullHash = sha256Hex(utrSeed);
      const bankCode = hop.from_bank.replace(/\W/g, '').toUpperCase();
      return {
        hop: idx + 1,
        utr_number: `DEMO-${bankCode}-${fullHash.slice(0, 10).toUpperCase()}`,
        tx_hash_sha256: '0x' + fullHash,
        npci_switch_ack: `NPCI-CBDC-SW-${fullHash.slice(10, 18).toUpperCase()}`,
        itc_cert_hash: '0x' + sha256Hex(`CGST_SEC16_2_CERT::${hop.irn_hash}::${fullHash}`)
      };
    });

    return {
      preimage_raw: preimageRaw,
      preimage_display: preimageDisplay,
      hash_lock_sha256: hashLockHex,
      sgx_mrenclave: sgxMrEnclave,
      sgx_quote_hash: sgxQuoteHash,
      rbi_serial_id: isCanonicalPeenya
        ? 'DEMO-eINR-PEENYA'
        : `eINR-2026-W-${parseInt(sha256Hex(ringId + hopFingerprint).slice(0, 8), 16).toString().slice(0, 8).padEnd(8, '4')}`,
      hop_receipts: hopReceipts
    };
  }

  global.Chakrika = global.Chakrika || {};
  global.Chakrika.escapeHtml = value => String(value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  global.Chakrika.Crypto = {
    sha256Hex,
    generateRingCryptoBundle
  };
})(window);

  <script>
/**
 * CHAKRIKA MATHEMATICAL GRAPH-NETTING & CYCLE DECOMPOSITION ENGINE
 * Implements:
 * 1. Statutory GST & Income Tax Pre-Processing (Sec 194Q / 194C TDS & Sec 16(2) 180-Day ITC Risk)
 * 2. Directed Weighted Multigraph G = (V, E, w) & Node Net Imbalance b(v)
 * 3. Tarjan's Strongly Connected Components (SCC) + Elementary Directed Cycle Enumeration
 * 4. Dual Clearing Modes:
 *    - Mode 2 (Primary): Full-Ring Atomic Clearance via NBFC Delta-Bridge Injection
 *    - Mode 1: Pure Bottleneck Compression (Zero External Credit, f_min loop)
 * 5. Programmable e₹ (CBDC) HTLC Smart-Rule Wrapper & Stakeholder Telemetry
 */
(function (global) {
  'use strict';

  const { Crypto, Data } = global.Chakrika;

  /**
   * Step 1: Statutory Pre-Processing of Raw ERP/GSTN Invoices
   * Computes w(u,v) = G_uv - T_uv and flags Section 16(2) CGST ITC Reversal Risk (>= 150 days)
   */
  function preprocessInvoices(rawInvoices, options = {}) {
    const tdsMode = options.tdsMode || 'STATUTORY'; // 'STATUTORY' | 'UNIFORM_194C_2' | 'GROSS_NO_TDS'
    const itcRiskThreshold = options.itcRiskThreshold || 150;

    return rawInvoices.map((inv, idx) => {
      const gross = Math.max(1, Math.round(Number(inv.gross_amount_inr) || 0));
      const gstIncluded = inv.gst_included_inr
        ? Math.round(Number(inv.gst_included_inr))
        : Math.round(gross - gross / 1.18);
      const baseTaxable = Math.max(1, gross - gstIncluded);

      let tdsSection = inv.tds_section || '194Q';
      let tdsRate = Number(inv.tds_rate ?? 0.001);
      let tdsDeduction = 0;

      if (tdsMode === 'GROSS_NO_TDS') {
        tdsSection = 'EXEMPT';
        tdsRate = 0;
        tdsDeduction = 0;
      } else if (tdsMode === 'UNIFORM_194C_2') {
        tdsSection = '194C_2';
        tdsRate = 0.02;
        tdsDeduction = Math.round(gross * 0.02);
      } else {
        // Statutory mode: preserve exact pre-computed deduction if unmodified, else compute from rate
        const meta = Data.TDS_SECTIONS[tdsSection] || Data.TDS_SECTIONS['194Q'];
        tdsRate = meta.rate;
        if (
          typeof inv.tds_deduction_inr === 'number' &&
          typeof inv.net_payable_inr === 'number' &&
          Math.abs(gross - inv.tds_deduction_inr - inv.net_payable_inr) <= 2
        ) {
          tdsDeduction = Math.round(inv.tds_deduction_inr);
        } else {
          // Note: Under Sec 194Q/194C, TDS is deducted to yield clean statutory payable w(u,v)
          tdsDeduction = Math.round(gross * tdsRate);
        }
      }

      const netPayable = Math.max(1, gross - tdsDeduction);
      const ageDays = Math.max(1, Math.round(Number(inv.invoice_age_days) || 30));
      const isItcRisk = ageDays >= itcRiskThreshold;
      const daysTo180 = Math.max(0, 180 - ageDays);

      // Under CGST Sec 16(2) read with Sec 50, failure to pay within 180 days requires
      // reversal of Input Tax Credit + 18% p.a. statutory interest from date of availment
      const itcInterestPenalty = Math.round(gstIncluded * 0.18 * (ageDays / 365));
      const totalItcExposure = isItcRisk ? gstIncluded + itcInterestPenalty : 0;

      return {
        ...inv,
        index: idx,
        base_taxable_inr: baseTaxable,
        gross_amount_inr: gross,
        gst_included_inr: gstIncluded,
        tds_section: tdsSection,
        tds_rate: tdsRate,
        tds_deduction_inr: tdsDeduction,
        net_payable_inr: netPayable, // w(u, v) = G_uv - T_uv
        invoice_age_days: ageDays,
        is_itc_risk: isItcRisk,
        days_to_180_cliff: daysTo180,
        itc_interest_penalty_inr: itcInterestPenalty,
        total_itc_exposure_inr: totalItcExposure
      };
    });

  /**
   * Step 2: Tarjan's Strongly Connected Components (SCC) Algorithm
   * Identifies cyclic industrial sub-clusters vs. acyclic peripheral spokes
   */
  function computeTarjanSCC(nodes, edges) {
    let index = 0;
    const indices = {};
    const lowlink = {};
    const onStack = {};
    const stack = [];
    const sccs = [];

    const adj = {};
    nodes.forEach(n => {
      adj[n.id] = [];
    });
    edges.forEach(e => {
      if (adj[e.from] && adj[e.to]) {
        adj[e.from].push(e);
      }
    });

    function strongConnect(nodeId) {
      indices[nodeId] = index;
      lowlink[nodeId] = index;
      index++;
      stack.push(nodeId);
      onStack[nodeId] = true;

      for (const edge of adj[nodeId] || []) {
        const wId = edge.to;
        if (indices[wId] === undefined) {
          strongConnect(wId);
          lowlink[nodeId] = Math.min(lowlink[nodeId], lowlink[wId]);
        } else if (onStack[wId]) {
          lowlink[nodeId] = Math.min(lowlink[nodeId], indices[wId]);
        }
      }

      if (lowlink[nodeId] === indices[nodeId]) {
        const component = [];
        let wId;
        do {
          wId = stack.pop();
          onStack[wId] = false;
          component.push(wId);
        } while (wId !== nodeId);
        sccs.push(component);

    for (const n of nodes) {
      if (indices[n.id] === undefined) {

              seenSignatures.add(canon.sig);
              rawCycles.push(canon.rotated);
            }
          } else if (!visitedNodes.has(nextId)) {
            // Only traverse nodes with order >= startNode to avoid duplicate work
            if ((nodeOrder[nextId] ?? 0) > (nodeOrder[startId] ?? 0)) {
              visitedNodes.add(nextId);
              edgeStack.push(edge);
              dfs(nextId);
              edgeStack.pop();
              visitedNodes.delete(nextId);
            }
          }
        }
      }

      dfs(startId);
    }

    return rawCycles;
  }

  /**
   * Step 4: Analyze a Single Directed Cycle C = (v_1 -> v_2 -> ... -> v_k -> v_1)
   * Computes:
   * - In-Ring Net Deficit: \Delta(v_i) = max(0, w(v_i, v_{i+1}) - w(v_{i-1}, v_i))
   * - Total Delta-Bridge Liquidity: L_bridge = \sum \Delta(v_i)
   * - Total Gross Debt Extinguished: W_gross = \sum w(v_i, v_{i+1})
   * - Liquidity Compression Ratio: \eta = (1 - L_bridge / W_gross) * 100%
   * - Sovereign Money Velocity: V = W_gross / L_bridge
   * - Pure Bottleneck Flow: f_min = min w(u,v)
   */
  function analyzeCycle(edgeCycle, cycleIdx, cluster, nodeMap, clearanceMode) {
    const k = edgeCycle.length;
    const ringNodes = edgeCycle.map(e => nodeMap[e.from]);

    let wGross = 0;
    let fMin = Infinity;
    let bottleneckEdgeId = null;

    edgeCycle.forEach(edge => {
      wGross += edge.net_payable_inr;
      if (edge.net_payable_inr < fMin) {
        fMin = edge.net_payable_inr;
        bottleneckEdgeId = edge.id;
      }
    });

    // Compute per-node in-ring balance and Delta-Bridge deficit \Delta(v_i)
    const participantMetrics = [];
    let lBridgeTotal = 0;
    let totalSurplusLocked = 0;

    for (let i = 0; i < k; i++) {
      const prevEdge = edgeCycle[(i - 1 + k) % k]; // (v_{i-1}, v_i)
      const outEdge = edgeCycle[i]; // (v_i, v_{i+1})
      const node = nodeMap[outEdge.from];

      const inRingReceivable = prevEdge.net_payable_inr; // w(v_{i-1}, v_i)
      const inRingPayable = outEdge.net_payable_inr; // w(v_i, v_{i+1})

      // b_ring(v_i) = w(v_{i-1}, v_i) - w(v_i, v_{i+1})
      const inRingNetPosition = inRingReceivable - inRingPayable;

      // \Delta(v_i) = max(0, w(v_i, v_{i+1}) - w(v_{i-1}, v_i))
      const deltaDeficit = Math.max(0, inRingPayable - inRingReceivable);
      const creditorSurplus = Math.max(0, inRingReceivable - inRingPayable);

      lBridgeTotal += deltaDeficit;
      totalSurplusLocked += creditorSurplus;

      participantMetrics.push({
        hop_order: i + 1,
        node_id: node.id,
        short_label: node.short_label,
        firm_name: node.name,
        gstin: node.gstin,
        bank: node.bank,
        ifsc: node.ifsc,
        vpa: node.vpa,
        incoming_edge_id: prevEdge.id,
        outgoing_edge_id: outEdge.id,
        in_ring_receivable_inr: inRingReceivable,
        in_ring_payable_inr: inRingPayable,
        in_ring_net_position_inr: inRingNetPosition,
        delta_deficit_inr: deltaDeficit,
        creditor_surplus_inr: creditorSurplus,
        position_type:
          inRingNetPosition < 0
            ? 'NET_DEBTOR'
            : inRingNetPosition > 0
            ? 'NET_CREDITOR'
            : 'NET_NEUTRAL'
      });
    }

    // Mode 1 (Pure Bottleneck Compression) vs Mode 2 (Full-Ring Delta-Bridge)
    const isBottleneckMode = clearanceMode === 'BOTTLENECK_ONLY';

    // Compression Ratio \eta = (1 - L_bridge / W_gross) * 100%
    const compressionRatioPct =
      wGross > 0 ? ((1 - lBridgeTotal / wGross) * 100) : 0;

    // Sovereign Money Velocity V = W_gross / L_bridge
    // If L_bridge === 0 (perfectly symmetric ring), use flash carrier notional or cap display
    const effectiveBridgeOrSeed = lBridgeTotal > 0 ? lBridgeTotal : Math.max(1, Math.round(fMin * 0.05));
    const moneyVelocity = wGross / effectiveBridgeOrSeed;

    // Mode 1 specific calculations
    const bottleneckExtinguishedGross = fMin * k;
    const bottleneckResidualGross = wGross - bottleneckExtinguishedGross;
    const bottleneckCoveragePct = wGross > 0 ? (bottleneckExtinguishedGross / wGross) * 100 : 0;

    // Active mode settlement per hop
    const orderedPathVector = edgeCycle.map((edge, idx) => {
      const fromNode = nodeMap[edge.from];
      const toNode = nodeMap[edge.to];
      const inflowCarrier = isBottleneckMode ? fMin : participantMetrics[idx].in_ring_receivable_inr;
      const settleAmount = isBottleneckMode ? fMin : edge.net_payable_inr;
      const residualAfterHop = isBottleneckMode ? edge.net_payable_inr - fMin : 0;

      return {
        hop: idx + 1,
        invoice_id: edge.id,
        from_node_id: fromNode.id,
        to_node_id: toNode.id,
        from_firm: fromNode.name,
        to_firm: toNode.name,
        from_bank: fromNode.bank,
        to_bank: toNode.bank,
        from_ifsc: fromNode.ifsc,
        to_ifsc: toNode.ifsc,
        from_vpa: fromNode.vpa,
        to_vpa: toNode.vpa,
        irn_hash: edge.irn_hash,
        hsn: edge.hsn,
        base_taxable_inr: edge.base_taxable_inr,
        gross_invoice_inr: edge.gross_amount_inr,
        tds_section: edge.tds_section,
        tds_deducted_inr: edge.tds_deduction_inr,
        statutory_net_payable_inr: edge.net_payable_inr,
        inflow_carrier_inr: inflowCarrier,
        settle_amount_inr: settleAmount,
        residual_unsettled_inr: residualAfterHop,
        invoice_age_days: edge.invoice_age_days,
        is_itc_risk: edge.is_itc_risk,
        gst_itc_protected_inr: edge.gst_included_inr,
        itc_interest_penalty_inr: edge.itc_interest_penalty_inr,
        itc_exposure_rescued_inr: edge.total_itc_exposure_inr,
        delta_injected_at_hop_inr: isBottleneckMode ? 0 : participantMetrics[idx].delta_deficit_inr,
        surplus_locked_at_hop_inr: isBottleneckMode ? 0 : participantMetrics[idx].creditor_surplus_inr
      };
    });

    const ringId =
      cycleIdx === 0
        ? cluster.ring_id
        : `${cluster.ring_id}-SUB-${cycleIdx + 1}`;

    const cryptoBundle = Crypto.generateRingCryptoBundle(
      ringId,
      orderedPathVector,
      cluster.id === 'PEENYA-094' && cycleIdx === 0
    );

    // Token denomination in header:
    // In Mode 2 (Full-Ring Delta-Bridge), denomination_inr is L_bridge (e.g., 400,000 for Peenya)
    // In Mode 1 (Pure Bottleneck Compression), denomination_inr is f_min (e.g., 900,000 flash seed that returns to issuer)
    const tokenDenominationInr = isBottleneckMode
      ? fMin
      : lBridgeTotal > 0
      ? lBridgeTotal
      : fMin;

    return {
      ring_id: ringId,
      cycle_index: cycleIdx,
      hop_count: k,
      node_ids: ringNodes.map(n => n.id),
      edge_ids: edgeCycle.map(e => e.id),
      participants: participantMetrics,
      w_gross_inr: wGross,
      l_bridge_inr: lBridgeTotal,
      total_surplus_locked_inr: totalSurplusLocked,
      f_min_inr: fMin,
      bottleneck_edge_id: bottleneckEdgeId,
      compression_ratio_pct: compressionRatioPct,
      money_velocity: moneyVelocity,
      is_pure_symmetric: lBridgeTotal === 0,
      // Mode-specific effective values
      clearance_mode: clearanceMode,
      active_extinguished_inr: isBottleneckMode ? bottleneckExtinguishedGross : wGross,
      active_residual_inr: isBottleneckMode ? bottleneckResidualGross : 0,
      active_external_credit_inr: isBottleneckMode ? 0 : lBridgeTotal,
      bottleneck_extinguished_inr: bottleneckExtinguishedGross,
      bottleneck_residual_inr: bottleneckResidualGross,
      bottleneck_coverage_pct: bottleneckCoveragePct,
      token_denomination_inr: tokenDenominationInr,
      ordered_path_vector: orderedPathVector,
      crypto: cryptoBundle,
      itc_risk_edges_count: edgeCycle.filter(e => e.is_itc_risk).length,
      itc_protected_total_inr: edgeCycle.reduce((acc, e) => acc + (e.is_itc_risk ? e.total_itc_exposure_inr : 0), 0),
      total_gst_settled_inr: edgeCycle.reduce((acc, e) => acc + e.gst_included_inr, 0),
      total_tds_compliant_inr: edgeCycle.reduce((acc, e) => acc + e.tds_deduction_inr, 0)
    };
  }

  /**
   * Builds the exact RBI Two-Tier Programmable e₹ Token JSON Payload (Section 4.3)
   */
  function buildProgrammableCbdcToken(activeRing, partnerNbfc, currentHopIndex, fsmPhase, faultState, rollbackCompleted = false) {
    if (!activeRing) return null;

    const htlcStatus = faultState
      ? (rollbackCompleted ? 'TIMELOCK_EXPIRED_ROLLED_BACK' : 'TIMELOCK_EXPIRED_LOCKS_HELD')
      : fsmPhase === 5
      ? 'ATOMICALLY_SETTLED_UNWRAPPED'
      : fsmPhase === 4
      ? 'PHASE1_HTLC_LOCKING'
      : 'SEALED_PENDING';

    const cleanPathVector = activeRing.ordered_path_vector.map(hop => ({
      hop: hop.hop,
      from_vpa: hop.from_vpa,
      to_vpa: hop.to_vpa,
      irn_hash: hop.irn_hash,
      hsn: hop.hsn,
      inflow_inr: hop.inflow_carrier_inr,
      delta_injected_inr: hop.delta_injected_at_hop_inr,
      surplus_locked_inr: hop.surplus_locked_at_hop_inr,
      settle_amount_inr: hop.settle_amount_inr
    }));

    return {
      token_header: {
        rbi_serial_id: activeRing.crypto.rbi_serial_id,
        issuer_bank_ifsc: partnerNbfc.issuer_bank_ifsc,
        denomination_inr: activeRing.token_denomination_inr,
        l_bridge_retained_inr: rollbackCompleted ? 0 : activeRing.active_external_credit_inr,
        f_min_flash_carrier_inr: activeRing.f_min_inr,
        token_type: 'PURPOSE_AND_PATH_BOUND_CBDC'
      },
      chakrika_smart_wrapper: {
        ring_id: activeRing.ring_id,
        atomic_lock_type: 'CROSS_BANK_HTLC_RING',
        htlc_status: htlcStatus,
        sgx_mrenclave: activeRing.crypto.sgx_mrenclave,
        hash_lock_sha256: activeRing.crypto.hash_lock_sha256,
        timelock_expiry_ms: 1500,
        ordered_path_vector: cleanPathVector,
        current_hop_index: currentHopIndex,
        unwrap_on_ring_completion: true
      }
    };
  }

  /**
   * Computes Stakeholder Economic & Regulatory Telemetry (Tab 1 & Tab 3)
   */
  function computeStakeholderTelemetry(cluster, processedInvoices, nodeBalances, activeRing, clearanceMode) {
    const clusterGrossPayables = processedInvoices.reduce((s, e) => s + e.net_payable_inr, 0);
    const clusterRawGross = processedInvoices.reduce((s, e) => s + e.gross_amount_inr, 0);
    const clusterTotalTds = processedInvoices.reduce((s, e) => s + e.tds_deduction_inr, 0);
    const clusterItcAtRiskInvoices = processedInvoices.filter(e => e.is_itc_risk);
    const clusterItcExposureInr = clusterItcAtRiskInvoices.reduce((s, e) => s + e.total_itc_exposure_inr, 0);

    if (!activeRing) {
      return {
        has_ring: false,
        cluster_gross_payables_inr: clusterGrossPayables,
        cluster_raw_gross_inr: clusterRawGross,
        cluster_total_tds_inr: clusterTotalTds,
        cluster_itc_risk_count: clusterItcAtRiskInvoices.length,
        cluster_itc_exposure_inr: clusterItcExposureInr
      };
    }

    const nbfc = cluster.partner_nbfc;
    const wGross = activeRing.w_gross_inr;
    const lBridge = activeRing.l_bridge_inr;
    const isBottleneck = clearanceMode === 'BOTTLENECK_ONLY';

    // Traditional MSME cash-credit / bill-discounting cost on W_gross (18% p.a. for 45 days)
    const traditionalWorkingCapInterestInr = Math.round(wGross * 0.18 * (45 / 365));

    // Chakrika NBFC Delta-Bridge cost: APR (e.g. 12.5% p.a.) for 15-day bridge tenure ONLY on L_bridge + flash fee
    const bridgeInterestInr = isBottleneck
      ? 0
      : Math.round(lBridge * (nbfc.apr_percent / 100) * (nbfc.bridge_tenure_days / 365));
    const flashPlatformFeeInr = Math.round(wGross * (nbfc.flash_fee_bps / 10000));
    const totalChakrikaCostInr = bridgeInterestInr + flashPlatformFeeInr;

    const msmeInterestSavingsInr = Math.max(0, traditionalWorkingCapInterestInr - totalChakrikaCostInr);
    const msmeTotalStatutoryBenefitInr = msmeInterestSavingsInr + activeRing.itc_protected_total_inr;

    // Partner NBFC ROE Telemetry:
    // NBFC deploys L_bridge for 15 days and earns bridgeInterest + 65% of flash fee
    const nbfcRevenueInr = bridgeInterestInr + Math.round(flashPlatformFeeInr * 0.65);
    const capitalDeployed = Math.max(100000, lBridge);
    const nbfcAnnualizedYieldPct =
      ((nbfcRevenueInr / capitalDeployed) * (365 / nbfc.bridge_tenure_days)) * 100;
    // Leverage-adjusted ROE (assuming 20% Tier-1 Capital Adequacy Ratio CRAR on 0%-diversion path-locked CBDC)
    const costOfFundsAnnualPct = 7.4;
    const nbfcNetRoePct = Math.min(48.5, Math.max(16.8, (nbfcAnnualizedYieldPct - costOfFundsAnnualPct) * 2.2));

    return {
      has_ring: true,
      cluster_gross_payables_inr: clusterGrossPayables,
      cluster_raw_gross_inr: clusterRawGross,
      cluster_total_tds_inr: clusterTotalTds,
      cluster_itc_risk_count: clusterItcAtRiskInvoices.length,
      cluster_itc_exposure_inr: clusterItcExposureInr,
      ring_gross_extinguished_inr: activeRing.active_extinguished_inr,
      ring_total_gross_inr: wGross,
      ring_delta_bridge_inr: lBridge,
      ring_bottleneck_fmin_inr: activeRing.f_min_inr,
      compression_ratio_pct: activeRing.compression_ratio_pct,
      money_velocity: activeRing.money_velocity,
      traditional_interest_cost_inr: traditionalWorkingCapInterestInr,
      bridge_interest_inr: bridgeInterestInr,
      flash_platform_fee_inr: flashPlatformFeeInr,
      total_chakrika_cost_inr: totalChakrikaCostInr,
      msme_interest_savings_inr: msmeInterestSavingsInr,
      itc_protected_inr: activeRing.itc_protected_total_inr,
      msme_total_benefit_inr: msmeTotalStatutoryBenefitInr,
      nbfc_revenue_inr: nbfcRevenueInr,
      nbfc_annualized_yield_pct: nbfcAnnualizedYieldPct,
      nbfc_roe_pct: nbfcNetRoePct,
      nbfc_apr_pct: nbfc.apr_percent,
      nbfc_tenure_days: nbfc.bridge_tenure_days
    };
  }

  /**
   * Master Graph Analysis Entrypoint
   * Runs full pipeline whenever cluster, invoices, tax filters, or clearance mode change
   */
  function evaluateClusterGraph(cluster, options = {}) {
    const clearanceMode = options.clearanceMode || 'FULL_RING_DELTA_BRIDGE'; // 'FULL_RING_DELTA_BRIDGE' | 'BOTTLENECK_ONLY'
    const selectedCycleIndex = options.selectedCycleIndex || 0;

    // 1. Statutory pre-processing
    const processedInvoices = preprocessInvoices(cluster.invoices, options);

    // 2. Build node map & compute full-cluster node net positions b(v)
    const nodeMap = {};
    const nodeBalances = {};

    cluster.nodes.forEach(node => {
      nodeMap[node.id] = node;
      nodeBalances[node.id] = {
        node_id: node.id,
        inflow_inr: 0,
        outflow_inr: 0,
        net_balance_inr: 0, // b(v) = \sum In - \sum Out
        status: 'NET_NEUTRAL',
        in_edges: [],
        out_edges: []
      };
    });

    processedInvoices.forEach(edge => {
      if (nodeBalances[edge.to]) {
        nodeBalances[edge.to].inflow_inr += edge.net_payable_inr;
        nodeBalances[edge.to].in_edges.push(edge.id);
      }
      if (nodeBalances[edge.from]) {
        nodeBalances[edge.from].outflow_inr += edge.net_payable_inr;
        nodeBalances[edge.from].out_edges.push(edge.id);
      }
    });

    Object.values(nodeBalances).forEach(nb => {
      nb.net_balance_inr = nb.inflow_inr - nb.outflow_inr;
      nb.status =
        nb.net_balance_inr < 0
          ? 'NET_DEBTOR'
          : nb.net_balance_inr > 0
          ? 'NET_CREDITOR'
          : 'NET_NEUTRAL';
    });

    // 3. Tarjan's Strongly Connected Components (SCC)
    const sccs = computeTarjanSCC(cluster.nodes, processedInvoices);
    const nonTrivialSccs = sccs.filter(c => c.length >= 2);
    const cyclicNodeIds = new Set();
    nonTrivialSccs.forEach(comp => comp.forEach(id => cyclicNodeIds.add(id)));

    // 4. Elementary Directed Cycle Detection (restricted to non-trivial Tarjan SCC nodes)
    const sccNodes = cluster.nodes.filter(n => cyclicNodeIds.has(n.id));
    const rawCycles = findElementaryCycles(sccNodes, processedInvoices);

    // Sort cycles so the largest / highest-gross cycle comes first
    rawCycles.sort((a, b) => {
      if (b.length !== a.length) return b.length - a.length;
      const sumA = a.reduce((s, e) => s + e.net_payable_inr, 0);
      const sumB = b.reduce((s, e) => s + e.net_payable_inr, 0);
      return sumB - sumA;
    });

    const analyzedRings = rawCycles.map((edgeCycle, idx) =>
      analyzeCycle(edgeCycle, idx, cluster, nodeMap, clearanceMode)
    );

    // Tag multi-cycle shared-edge contention across detected elementary cycles
    const edgeCycleCounts = {};
    analyzedRings.forEach(r => {
      r.edge_ids.forEach(eid => {
        edgeCycleCounts[eid] = (edgeCycleCounts[eid] || 0) + 1;
      });
    });
    analyzedRings.forEach(r => {
      r.shared_edge_ids = r.edge_ids.filter(eid => edgeCycleCounts[eid] > 1);
    });

    const safeCycleIdx =
      analyzedRings.length > 0
        ? Math.min(selectedCycleIndex, analyzedRings.length - 1)
        : 0;
    const activeRing = analyzedRings[safeCycleIdx] || null;

    // Tag nodes & edges with active-ring membership and in-ring metrics
    const activeRingNodeMap = {};
    if (activeRing) {
      activeRing.participants.forEach(p => {
        activeRingNodeMap[p.node_id] = p;
      });
    }
    const activeRingEdgeSet = new Set(activeRing ? activeRing.edge_ids : []);

    const enrichedNodes = cluster.nodes.map(node => {
      const clusterBal = nodeBalances[node.id];
      const ringParticipant = activeRingNodeMap[node.id] || null;
      return {
        ...node,
        in_scc: cyclicNodeIds.has(node.id),
        in_active_ring: Boolean(ringParticipant),
        cluster_inflow_inr: clusterBal.inflow_inr,
        cluster_outflow_inr: clusterBal.outflow_inr,
        cluster_net_balance_inr: clusterBal.net_balance_inr,
        cluster_status: clusterBal.status,
        ring_metrics: ringParticipant
      };
    });

    const enrichedEdges = processedInvoices.map(edge => {
      const inActiveRing = activeRingEdgeSet.has(edge.id);
      let hopInfo = null;
      if (inActiveRing && activeRing) {
        hopInfo = activeRing.ordered_path_vector.find(h => h.invoice_id === edge.id) || null;
      }
      return {
        ...edge,
        in_active_ring: inActiveRing,
        is_bottleneck_edge: activeRing ? activeRing.bottleneck_edge_id === edge.id : false,
        hop_info: hopInfo
      };
    });

    const telemetry = computeStakeholderTelemetry(
      cluster,
      enrichedEdges,
      nodeBalances,
      activeRing,
      clearanceMode
    );

    return {
      cluster_id: cluster.id,
      cluster_name: cluster.name,
      partner_nbfc: cluster.partner_nbfc,
      clearance_mode: clearanceMode,
      nodes: enrichedNodes,
      edges: enrichedEdges,
      sccs: nonTrivialSccs,
      rings: analyzedRings,
      selected_ring_index: safeCycleIdx,
      active_ring: activeRing,
      telemetry,
      buildTokenPayload: (hopIdx, phase, fault, rollback) =>
        buildProgrammableCbdcToken(activeRing, cluster.partner_nbfc, hopIdx, phase, fault, rollback)
    };
  }

  global.Chakrika = global.Chakrika || {};
  global.Chakrika.GraphEngine = {
    preprocessInvoices,
    computeTarjanSCC,
    findElementaryCycles,
    evaluateClusterGraph,
    buildProgrammableCbdcToken
  };
})(window);

        <!-- 3-Tier Golden Coin Stack on Top -->
        <path d="M -8,-14 L -8,-4 A 11,4.5 0 0,0 14,-4 L 14,-14 Z" fill="#D97706" stroke="#1E2430" stroke-width="2"/>
        <ellipse cx="3" cy="-9" rx="11" ry="4.5" fill="#F59E0B" stroke="#1E2430" stroke-width="1.8"/>
        <path d="M -8,-22 L -8,-12 A 11,4.5 0 0,0 14,-12 L 14,-22 Z" fill="#EAB308" stroke="#1E2430" stroke-width="2"/>
        <ellipse cx="3" cy="-22" rx="11" ry="4.5" fill="#FACC15" stroke="#1E2430" stroke-width="2"/>

        <!-- Steel-Blue HTLC Padlock in Foreground Right -->
        <path d="M 14,4 L 14,-3 A 6.5,6.5 0 0,1 27,-3 L 27,4" fill="none" stroke="#1E2430" stroke-width="4.2" stroke-linecap="round"/>
        <path d="M 14,4 L 14,-3 A 6.5,6.5 0 0,1 27,-3 L 27,4" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
        <rect x="9" y="3" width="23" height="20" rx="4" fill="${lockBodyColor}" stroke="#1E2430" stroke-width="2.2"/>
        <circle cx="20.5" cy="11.5" r="2.3" fill="#1E2430"/>
        <path d="M 19.3,12.5 L 18.5,17.5 L 22.5,17.5 L 21.7,12.5 Z" fill="#1E2430"/>
      </g>
    `;
  }

  class SupplyChainGraphRenderer {
    constructor(svgElement, tooltipElement, callbacks = {}) {
      this.svg = svgElement;
      this.tooltip = tooltipElement;
      this.callbacks = callbacks;

      this.theme = 'light'; // 'light' (Illustrated Parchment Default) | 'dark'
      this.layoutMode = 'CLUSTER'; // 'CLUSTER' | 'RING'
      this.graphData = null;
      this.fsmState = null;

      this.nodePositions = {};
      this.customNodeOffsets = {};
      this.selectedEntity = null;
      this.hoveredEntity = null;

      this.zoom = 1;
      this.panX = 0;
      this.panY = 0;
      this.isPanning = false;
      this.draggingNodeId = null;
      this.dragStart = { x: 0, y: 0 };

      this.animFrameId = null;
      this.particlePhase = 0;
      this.activeEdgePaths = [];

      this._initEvents();
      this._startAnimationLoop();
    }

    setTheme(theme) {
      this.theme = theme === 'dark' ? 'dark' : 'light';
      this.render();
    }

    setLayoutMode(mode, redraw = true) {
      if (this.layoutMode !== mode) {
        this.layoutMode = mode;
        this.customNodeOffsets = {};
        this.resetViewport();
        if (redraw) this.render();
      }
    }

    resetViewport() {
      this.zoom = 1;
      this.panX = 0;
      this.panY = 0;
      if (this.callbacks && this.callbacks.onZoomChange) {
        this.callbacks.onZoomChange(this.zoom);
      }
    }

    zoomBy(factor, pivotX = 580, pivotY = 300) {
      const prevZoom = this.zoom;
      const nextZoom = Math.min(2.2, Math.max(0.45, prevZoom * factor));
      if (Math.abs(nextZoom - prevZoom) < 0.001) return;

      // Keep the pivot point (center of canvas or cursor) stationary in viewBox coordinates
      this.panX = pivotX - ((pivotX - this.panX) / prevZoom) * nextZoom;
      this.panY = pivotY - ((pivotY - this.panY) / prevZoom) * nextZoom;
      this.zoom = nextZoom;

      const viewportG = this.svg.querySelector('#graph-viewport-root');
      if (viewportG) {
        viewportG.setAttribute(
          'transform',
          `translate(${this.panX.toFixed(1)}, ${this.panY.toFixed(1)}) scale(${this.zoom.toFixed(3)})`
        );
      }
      if (this.callbacks && this.callbacks.onZoomChange) {
        this.callbacks.onZoomChange(this.zoom);
      }
    }

    zoomIn() {
      this.zoomBy(1.18, 580, 300);
    }

    zoomOut() {
      this.zoomBy(1 / 1.18, 580, 300);
    }

    setHoveredEntity(type, id, fromExternal = false) {
      const prev = this.hoveredEntity;
      if (!type || !id) {
        this.hoveredEntity = null;
      } else {
        this.hoveredEntity = { type, id };
      }

      const changed =
        (prev && !this.hoveredEntity) ||
        (!prev && this.hoveredEntity) ||
        (prev && this.hoveredEntity && (prev.type !== type || prev.id !== id));

      if (changed) {
        this._applyHoverHighlightClasses();
        if (this.hoveredEntity) {
          this._showEntityTooltip(this.hoveredEntity.type, this.hoveredEntity.id);
        } else if (this.selectedEntity) {
          this._showEntityTooltip(this.selectedEntity.type, this.selectedEntity.id);
        } else if (this.tooltip) {
          this.tooltip.classList.add('hidden');
        }

        if (!fromExternal && this.callbacks.onHoverEntity) {
          this.callbacks.onHoverEntity(type, id);
        }
      }
    }

    _applyHoverHighlightClasses() {
      if (!this.svg || !this.graphData) return;

      const hov = this.hoveredEntity;
      let targetEdgeId = null;
      const targetNodeIds = new Set();

      if (hov) {
        if (hov.type === 'EDGE') {
          targetEdgeId = hov.id;
          const edgeObj = this.graphData.edges.find(e => e.id === hov.id);
          if (edgeObj) {
            targetNodeIds.add(edgeObj.from);
            targetNodeIds.add(edgeObj.to);
          }
        } else if (hov.type === 'NODE') {
          targetNodeIds.add(hov.id);
        }
      }

      this.svg.querySelectorAll('.graph-node-card').forEach(el => {
        const nid = el.getAttribute('data-node-id');
        if (targetNodeIds.has(nid)) {
          el.classList.add('is-synced-hover');
        } else {
          el.classList.remove('is-synced-hover');
        }
      });

      this.svg.querySelectorAll('.graph-edge-pill').forEach(el => {
        const eid = el.getAttribute('data-edge-id');
        if (eid === targetEdgeId) {
          el.classList.add('is-synced-hover');
        } else {
          el.classList.remove('is-synced-hover');
        }
      });

      this.svg.querySelectorAll('.graph-edge-main-path').forEach(el => {
        const eid = el.getAttribute('data-edge-path-id');
        if (eid === targetEdgeId) {
          el.setAttribute('stroke-width', '7.2');
        } else {
          const baseW = el.getAttribute('data-base-width') || '5.2';
          el.setAttribute('stroke-width', baseW);
        }
      });
    }

    update(graphData, fsmState) {
      const clusterChanged =
        !this.graphData || this.graphData.cluster_id !== graphData.cluster_id;
      this.graphData = graphData;
      this.fsmState = fsmState;

      if (clusterChanged) {
        this.customNodeOffsets = {};
        this.selectedEntity = null;
        this.hoveredEntity = null;
        this.resetViewport();
      }

      this.render();
    }

    _initEvents() {
      this.svg.addEventListener('mousedown', e => {
        const nodeGroup = e.target.closest('[data-node-id]');
        const edgeGroup = e.target.closest('[data-edge-id]');

        if (nodeGroup) {
          const nodeId = nodeGroup.getAttribute('data-node-id');
          this.draggingNodeId = nodeId;
          const pt = this._screenToSvg(e.clientX, e.clientY);
          const pos = this.nodePositions[nodeId] || { x: 0, y: 0 };
          this.dragStart = { x: pt.x - pos.x, y: pt.y - pos.y };
          this.selectEntity('NODE', nodeId);
          e.stopPropagation();
          return;
        }

        if (edgeGroup) {
          const edgeId = edgeGroup.getAttribute('data-edge-id');
          this.selectEntity('EDGE', edgeId);
          e.stopPropagation();
          return;
        }

        if (this.selectedEntity) {
          this.selectedEntity = null;
          if (this.callbacks.onSelectEntity) {
            this.callbacks.onSelectEntity(null, null);
          }
          this.render();
        }

        this.isPanning = true;
        const point = this._viewportPoint(e.clientX, e.clientY);
        this.dragStart = { x: point.x - this.panX, y: point.y - this.panY };
      });

      window.addEventListener('mousemove', e => {
        if (this.draggingNodeId) {
          const pt = this._screenToSvg(e.clientX, e.clientY);
          this.customNodeOffsets[this.draggingNodeId] = {
            x: pt.x - this.dragStart.x,
            y: pt.y - this.dragStart.y
          };
          this.render();
          return;
        }

        if (this.isPanning) {
          const point = this._viewportPoint(e.clientX, e.clientY);
          this.panX = point.x - this.dragStart.x;
          this.panY = point.y - this.dragStart.y;
          const viewportG = this.svg.querySelector('#graph-viewport-root');
          if (viewportG) {
            viewportG.setAttribute(
              'transform',
              `translate(${this.panX}, ${this.panY}) scale(${this.zoom})`
            );
          }
        }
      });

      window.addEventListener('mouseup', () => {
        this.draggingNodeId = null;
        this.isPanning = false;
      });

      this.svg.addEventListener(
        'wheel',
        e => {
          e.preventDefault();
          const factor = e.deltaY < 0 ? 1.1 : 0.9;
          const { x: pivotX, y: pivotY } = this._viewportPoint(e.clientX, e.clientY);
          this.zoomBy(factor, pivotX, pivotY);
        },
        { passive: false }
      );
    }

    _viewportPoint(clientX, clientY) {
      return new DOMPoint(clientX, clientY).matrixTransform(this.svg.getScreenCTM().inverse());
    }

    _screenToSvg(clientX, clientY) {
      const point = this._viewportPoint(clientX, clientY);
      return {
        x: (point.x - this.panX) / this.zoom,
        y: (point.y - this.panY) / this.zoom
      };
    }

    selectEntity(type, id) {
      this.selectedEntity = { type, id };
      if (this.callbacks.onSelectEntity) {
        this.callbacks.onSelectEntity(type, id);
      }
      this.render();
    }

    /**
     * Compute clean, non-overlapping coordinates in an 1160x600 coordinate space
     */
    _computeLayout(width, height) {
      const positions = {};
      if (!this.graphData) return positions;

      const cx = width / 2;
      const cy = height / 2;
      const ring = this.graphData.active_ring;
      const ringNodeIds = ring ? ring.node_ids : [];
      const ringSet = new Set(ringNodeIds);

      if (this.layoutMode === 'RING' && ringNodeIds.length > 0) {
        const k = ringNodeIds.length;
        const rx = k <= 4 ? 345 : 365;
        const ry = k <= 4 ? 195 : 210;
        ringNodeIds.forEach((nodeId, idx) => {
          const baseAngle = k === 4 ? -Math.PI * 0.75 : -Math.PI / 2;
          const angle = baseAngle + (idx * 2 * Math.PI) / k;
          positions[nodeId] = {
            x: cx + rx * Math.cos(angle),
            y: cy + ry * Math.sin(angle)
          };
        });
      } else {
        const k = ringNodeIds.length;
        const peripheralNodes = this.graphData.nodes.filter(n => !ringSet.has(n.id));
        const hasPeripherals = peripheralNodes.length > 0;

        if (k > 0) {
          const rx = hasPeripherals ? 285 : 340;
          const ry = hasPeripherals ? 182 : 195;

          ringNodeIds.forEach((nodeId, idx) => {
            const baseAngle = k === 4 ? -Math.PI * 0.75 : -Math.PI / 2;
            const angle = baseAngle + (idx * 2 * Math.PI) / k;
            positions[nodeId] = {
              x: cx + rx * Math.cos(angle),
              y: cy + ry * Math.sin(angle)
            };
          });
        }

        peripheralNodes.forEach((pNode, idx) => {
          const isSupplier = pNode.cluster_outflow_inr >= pNode.cluster_inflow_inr;
          if (isSupplier && idx === 0) {
            positions[pNode.id] = { x: 118, y: 74 };
          } else if (!isSupplier && idx <= 1) {
            positions[pNode.id] = { x: width - 118, y: height - 74 };
          } else {
            const sideX = idx % 2 === 0 ? 118 : width - 118;
            const rowY = 74 + Math.floor(idx / 2) * 205;
            positions[pNode.id] = { x: sideX, y: Math.min(height - 74, rowY) };
          }
        });
      }

      Object.keys(this.customNodeOffsets).forEach(nodeId => {
        if (positions[nodeId]) {
          positions[nodeId] = { ...this.customNodeOffsets[nodeId] };
        }
      });

      this.nodePositions = positions;
      return positions;
    }

    _clipToCardRect(center, target, halfW = 110, halfH = 44) {
      const dx = target.x - center.x;
      const dy = target.y - center.y;
      if (Math.abs(dx) < 0.01 && Math.abs(dy) < 0.01) return { ...center };

      const scaleX = halfW / Math.max(0.01, Math.abs(dx));
      const scaleY = halfH / Math.max(0.01, Math.abs(dy));
      const scale = Math.min(scaleX, scaleY);

      return {
        x: center.x + dx * scale,
        y: center.y + dy * scale
      };
    }

    render() {
      if (!this.graphData || !this.fsmState) return;

      const W = 1160;
      const H = 600;
      this.svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

      const positions = this._computeLayout(W, H);
      const ring = this.graphData.active_ring;
      const ringSet = new Set(ring ? ring.node_ids : []);
      const phase = this.fsmState.phase;
      const clearanceMode = this.graphData.clearance_mode;

      const visibleNodes =
        this.layoutMode === 'RING' && ring
          ? this.graphData.nodes.filter(n => ringSet.has(n.id))
          : this.graphData.nodes;

      const visibleNodeIds = new Set(visibleNodes.map(n => n.id));
      const visibleEdges = this.graphData.edges.filter(
        e => visibleNodeIds.has(e.from) && visibleNodeIds.has(e.to) &&
          (this.layoutMode !== 'RING' || !ring || e.in_active_ring)
      );

      this.activeEdgePaths = [];

      let defsHtml = `
        <defs>
          <pattern id="terminal-grid" width="36" height="36" patternUnits="userSpaceOnUse">
            <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1E325C" stroke-width="0.8" stroke-opacity="0.55"/>
            <circle cx="18" cy="18" r="0.9" fill="#3B5998" fill-opacity="0.35"/>
          </pattern>
          <radialGradient id="enclave-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
            <stop offset="65%" stop-color="#6366f1" stop-opacity="0.06"/>
            <stop offset="100%" stop-color="#14223D" stop-opacity="0"/>
          </radialGradient>
          <filter id="card-shadow" x="-12%" y="-12%" width="124%" height="130%"><feDropShadow dx="2" dy="3" stdDeviation="1" flood-color="#0B1324" flood-opacity="0.85"/></filter>
          <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
          </filter>
          <!-- Bold Ink-Outlined Arrowheads Matching Reference Illustration -->
          <marker id="arrow-ring-default" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
            <path d="M 1 2 L 12 7 L 1 12 L 3.2 7 z" fill="#74B9FF" stroke="#1E2430" stroke-width="1.6" stroke-linejoin="round"/>
          </marker>
          <marker id="arrow-ring-risk" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
            <path d="M 1 2 L 12 7 L 1 12 L 3.2 7 z" fill="#74B9FF" stroke="#1E2430" stroke-width="1.6" stroke-linejoin="round"/>
          </marker>
          <marker id="arrow-ring-settled" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
            <path d="M 1 2 L 12 7 L 1 12 L 3.2 7 z" fill="#68D391" stroke="#1E2430" stroke-width="1.6" stroke-linejoin="round"/>
          </marker>
          <marker id="arrow-ring-fault" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
            <path d="M 1 2 L 12 7 L 1 12 L 3.2 7 z" fill="#F56565" stroke="#1E2430" stroke-width="1.6" stroke-linejoin="round"/>
          </marker>
          <marker id="arrow-spoke" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
            <path d="M 1 2 L 10 6 L 1 10 z" fill="#94A3B8" stroke="#0F172A" stroke-width="1.2"/>
          </marker>
          <marker id="arrow-nbfc-bridge" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
            <path d="M 1 2 L 12 7 L 1 12 L 3.2 7 z" fill="#E5A9F2" stroke="#1E2430" stroke-width="1.6" stroke-linejoin="round"/>
          </marker>
        </defs>
      `;

      let bgOverlayHtml = `
        <rect width="${W}" height="${H}" fill="url(#terminal-grid)"/>
      `;

      const ringCx = W / 2;
      const ringCy = H / 2;

      if (ring && phase >= 2) {
        bgOverlayHtml += `
          <ellipse cx="${ringCx}" cy="${ringCy}" rx="340" ry="225" fill="url(#enclave-glow)" />
          <ellipse cx="${ringCx}" cy="${ringCy}" rx="294" ry="165" fill="none"
            stroke="${this.fsmState.faultTriggered ? '#F56565' : phase === 5 ? '#68D391' : '#74B9FF'}"
            stroke-opacity="0.38" stroke-width="2" stroke-dasharray="7 7"/>
        `;
      }

      // Central Hub (Warm Cream Illustrated Card + Radial Lavender Δ-Bridge Vectors)
      let centralHubHtml = '';
      if (ring && phase >= 2) {
        const nbfc = this.graphData.partner_nbfc;
        const isDeltaMode = clearanceMode === 'FULL_RING_DELTA_BRIDGE';

        if (isDeltaMode && phase >= 3 && !this.fsmState.rollbackCompleted) {
          ring.participants.forEach(p => {
            if (p.delta_deficit_inr > 0 && positions[p.node_id]) {
              const targetPos = positions[p.node_id];
              const startPt = this._clipToCardRect({ x: ringCx, y: ringCy }, targetPos, 160, 46);
              const endPt = this._clipToCardRect(targetPos, { x: ringCx, y: ringCy }, 108, 44);
              const midX = (startPt.x + endPt.x) / 2;
              const midY = (startPt.y + endPt.y) / 2;

              const strokeColor = this.fsmState.rollbackCompleted ? '#94a3b8' : '#E5A9F2';

              centralHubHtml += `
                <g class="nbfc-bridge-vector">
                  <!-- Dark Ink Casing Underlay -->
                  <line x1="${startPt.x}" y1="${startPt.y}" x2="${endPt.x}" y2="${endPt.y}"
                    stroke="#0B1324" stroke-width="6.2" stroke-dasharray="8 6" stroke-linecap="round" opacity="0.85"/>
                  <!-- Pastel Lavender Dashed Vector -->
                  <line x1="${startPt.x}" y1="${startPt.y}" x2="${endPt.x}" y2="${endPt.y}"
                    stroke="${strokeColor}" stroke-width="3.6" stroke-dasharray="8 6" stroke-linecap="round"
                    marker-end="url(#arrow-nbfc-bridge)" />
                  <!-- Offset Shadow for Δ Pill -->
                  <rect x="${midX - 51}" y="${midY - 11}" width="106" height="26" rx="8" fill="#0B1324"/>
                  <!-- Soft Lavender Callout Pill -->
                  <rect x="${midX - 53}" y="${midY - 14}" width="106" height="26" rx="8"
                    fill="#F3DDFB" stroke="#1E2430" stroke-width="2"/>
                  <text x="${midX}" y="${midY + 3}" text-anchor="middle" fill="#1E2430"
                    font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="11.5" font-weight="800">
                    Δ +${formatLakhs(p.delta_deficit_inr)}
                  </text>
                </g>
              `;
            }
          });
        }

        const isSettled = phase === 5 && !this.fsmState.faultTriggered;
        const hubBorder = this.fsmState.faultTriggered
          ? '#E11D48'
          : isSettled
          ? '#15803D'
          : '#1E2430';

        const hubTitle = this.fsmState.rollbackCompleted ? 'ATOMIC ROLLBACK COMPLETE'
          : this.fsmState.faultTriggered ? 'SWITCH TIMEOUT • LOCKS HELD'
          : isSettled ? 'ATOMIC SETTLEMENT COMPLETE'
          : phase === 2 ? 'SGX • ACTIVE CYCLE IDENTIFIED'
          : phase === 4 ? 'HTLC • PAYMENT LOCKS'
          : isDeltaMode ? `NBFC Δ-BRIDGE • ${nbfc.issuer_bank_ifsc}`
          : `FLASH SEED • ${nbfc.issuer_bank_ifsc}`;
        const hubMetric = this.fsmState.rollbackCompleted
          ? 'Provisional locks released • ₹0 moved'
          : phase === 4
          ? `${this.fsmState.hopStates.filter(state => state === 'LOCKED').length} / ${ring.hop_count} hops locked`
          : isDeltaMode
          ? `L_bridge: ${formatLakhs(ring.l_bridge_inr)}  |  η: ${ring.compression_ratio_pct.toFixed(1)}%`
          : `f_min Seed: ${formatLakhs(ring.f_min_inr)}  |  Cov: ${ring.bottleneck_coverage_pct.toFixed(1)}%`;

        const hubW = 360;
        const hubH = 92;

        centralHubHtml += `
          <g class="settlement-hub" transform="translate(${ringCx}, ${ringCy})">
            <!-- Tactile 3D Offset Shadow -->
            <rect x="${-hubW / 2 + 5}" y="${-hubH / 2 + 6}" width="${hubW}" height="${hubH}" rx="15" fill="#0B1324"/>
            <!-- Warm Cream Parchment Card Body -->
            <rect x="${-hubW / 2}" y="${-hubH / 2}" width="${hubW}" height="${hubH}" rx="15"
              fill="#FDF3DC" stroke="${hubBorder}" stroke-width="2.8"/>

            <!-- Left Illustrated Ledger Stack + Golden Coins + Padlock -->
            ${getCentralHubIllustrationSvg(phase >= 3, this.fsmState.faultTriggered)}

            <!-- Vertical Ink Divider Line -->
            <line x1="-68" y1="-32" x2="-68" y2="32" stroke="#1E2430" stroke-width="2"/>

            <!-- Right Typography (Matching Reference Image Layout) -->
            <text x="-54" y="-17" fill="#1E2430" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="12.5" font-weight="800">
              ${hubTitle}
            </text>
            <text x="-54" y="3" fill="#1E2430" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="12.5" font-weight="800">
              ${hubMetric}
            </text>
            <!-- Horizontal Divider Rule -->
            <line x1="-54" y1="12" x2="${hubW / 2 - 16}" y2="12" stroke="#1E2430" stroke-width="1.6"/>
            <text x="-54" y="29" fill="#2D3748" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="11.5" font-weight="700">
              ${ring.ring_id} • V = ${ring.money_velocity.toFixed(1)}x
            </text>
          </g>
        `;
      }

      // Draw Directed Edges (Thick Ink-Outlined Curved Ribbon Arrows)
      let edgesHtml = '';
      let edgeLabelsHtml = '';

      visibleEdges.forEach(edge => {
        const uPos = positions[edge.from];
        const vPos = positions[edge.to];
        if (!uPos || !vPos) return;

        const inRing = edge.in_active_ring;
        const hopIdx = edge.hop_info ? edge.hop_info.hop - 1 : -1;
        const hopState =
          inRing && hopIdx >= 0 && this.fsmState.hopStates[hopIdx]
            ? this.fsmState.hopStates[hopIdx]
            : 'PENDING';

        const dx = vPos.x - uPos.x;
        const dy = vPos.y - uPos.y;
        const dist = Math.max(1, Math.hypot(dx, dy));
        const mx = (uPos.x + vPos.x) / 2;
        const my = (uPos.y + vPos.y) / 2;

        let nx = -dy / dist;
        let ny = dx / dist;
        const toMidX = mx - ringCx;
        const toMidY = my - ringCy;
        if (nx * toMidX + ny * toMidY < 0) {
          nx = -nx;
          ny = -ny;
        }

        const curveOffset = inRing ? 82 : 46;
        const ctrlPt = {
          x: mx + nx * curveOffset,
          y: my + ny * curveOffset
        };

        const startPt = this._clipToCardRect(uPos, ctrlPt, 108, 43);
        const endPt = this._clipToCardRect(vPos, ctrlPt, 112, 46);

        const pathD = `M ${startPt.x.toFixed(1)} ${startPt.y.toFixed(1)} Q ${ctrlPt.x.toFixed(1)} ${ctrlPt.y.toFixed(1)} ${endPt.x.toFixed(1)} ${endPt.y.toFixed(1)}`;

        const labelX = 0.25 * startPt.x + 0.5 * ctrlPt.x + 0.25 * endPt.x;
        const labelY = 0.25 * startPt.y + 0.5 * ctrlPt.y + 0.25 * endPt.y;

        let strokeColor = '#64748B';
        let strokeWidth = 3.0;
        let dashArray = '6 5';
        let markerId = 'arrow-spoke';
        let statusTag = '';
        let subStripBg = '#F8CB66'; // Warm Golden Amber for 16(2) risk

        if (inRing) {
          dashArray = 'none';
          strokeWidth = 5.2;
          if (hopState === 'SETTLED' || (phase === 5 && !this.fsmState.faultTriggered)) {
            strokeColor = '#68D391';
            markerId = 'arrow-ring-settled';
            statusTag = edge.hop_info?.residual_unsettled_inr > 0 ? 'PARTIAL ✓' : 'SETTLED ✓';
            subStripBg = '#9ED29E';
          } else if (hopState === 'FAULTED') {
            strokeColor = '#F56565';
            strokeWidth = 5.8;
            markerId = 'arrow-ring-fault';

        const pathDomId = `svg-edge-path-${edge.id}`;
        const shouldAnimateParticles =

        edgesHtml += `

        // Warm Cream Parchment Edge Pill Label (Matching Reference Image)
        const hopPrefix = edge.hop_info ? `H${edge.hop_info.hop} • ` : 'SPK • ';
        const displayAmount =
          inRing && edge.hop_info && phase >= 2

        if (statusTag) {

              fill="#FDF3DC" stroke="#1E2430" stroke-width="${isSelected ? '3' : '2.2'}"/>
            ${
              subText
                ? `<!-- Golden Amber / Status Sub-Band -->
                   <rect x="${labelX - pillW / 2 + 4}" y="${labelY + 1}" width="${pillW - 8}" height="17" rx="5"
                     fill="${subStripBg}" stroke="#1E2430" stroke-width="1.2"/>
                   <text x="${labelX}" y="${labelY - 5}" text-anchor="middle" fill="#1E2430"
                     font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="12" font-weight="800">
                     ${hopPrefix}${displayAmount}
                   </text>
                   <text x="${labelX}" y="${labelY + 13}" text-anchor="middle" fill="#1E2430"
                     font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="9.5" font-weight="800">
                     ${subText}
                   </text>`
                : `<text x="${labelX}" y="${labelY + 4.5}" text-anchor="middle" fill="#1E2430"
                     font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="12" font-weight="800">
                     ${hopPrefix}${displayAmount}
                   </text>`
            }
          </g>
        `;
      });

      const particlesLayerHtml = `<g id="cbdc-particles-layer"></g>`;

      // Draw Warm Parchment Illustrated Node Cards
      let nodesHtml = '';
      visibleNodes.forEach((node, idx) => {
        const pos = positions[node.id];
        if (!pos) return;

        const bankTheme = BANK_BADGES[node.bank] || BANK_BADGES['Bank A'];
        const inRing = node.in_active_ring;

        const activeBalance =
          phase >= 2 && inRing && ringMetrics
            ? ringMetrics.in_ring_net_position_inr

        } else if (activeBalance < 0) {

        }

        const isSelected =
          this.selectedEntity &&

        const cardW = 216;
        const cardH = 84;

        const hasDeltaBadge =
          phase >= 2 && phase < 5 && !this.fsmState.rollbackCompleted && inRing &&

          ringMetrics.delta_deficit_inr > 0 &&
          clearanceMode === 'FULL_RING_DELTA_BRIDGE';

        const bottomRightSlotHtml = hasDeltaBadge

               ${node.bank}

        nodesHtml += `

            <!-- Hard 3D Offset Ink Drop Shadow -->
            <rect x="${-cardW / 2 + 4}" y="${-cardH / 2 + 5}" width="${cardW}" height="${cardH}" rx="14" fill="#0B1324"/>

            <!-- Warm Cream Parchment Card Body -->
            <rect class="node-card-bg" x="${-cardW / 2}" y="${-cardH / 2}" width="${cardW}" height="${cardH}" rx="14"
              fill="#FDF3DC" stroke="${isSelected ? '#74B9FF' : '#1E2430'}" stroke-width="${isSelected ? '3.4' : '2.6'}"/>

            <!-- Custom Illustrated Building / Ledger Icon (Left Side) -->
            ${getNodeIllustrationSvg(node, idx)}

            <!-- Vertical Ink Divider Line -->
            <line x1="-38" y1="-28" x2="-38" y2="2" stroke="#1E2430" stroke-width="1.8"/>

            <!-- Firm Short Label (e.g. MSME-A) -->
            <text x="-28" y="-9" fill="#1E2430"
              font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="14" font-weight="800">
              ${node.short_label}
            </text>

            <!-- Bank Pill Badge (Top Right: SBI, HDFC, ICICI, AXIS) -->
            <rect x="46" y="-26" width="52" height="23" rx="6"
              fill="${bankTheme.bg}" stroke="${bankTheme.border}" stroke-width="1.8"/>
            <text x="72" y="-10.5" text-anchor="middle" fill="${bankTheme.text}"

      this.svg.innerHTML = `
        ${defsHtml}
        <g id="graph-viewport-root" transform="translate(${this.panX}, ${this.panY}) scale(${this.zoom})">
          ${bgOverlayHtml}

          ${edgesHtml}
          ${particlesLayerHtml}
          ${edgeLabelsHtml}
          ${nodesHtml}
        </g>
      `;

      this._bindHoverTooltips();
      this._applyHoverHighlightClasses();
      this._updateInspectorHud();
    }

    _bindHoverTooltips() {
      const nodeEls = this.svg.querySelectorAll('[data-node-id]');
      nodeEls.forEach(el => {
        el.addEventListener('mouseenter', () => {
          const nodeId = el.getAttribute('data-node-id');
          this.setHoveredEntity('NODE', nodeId, false);
        });
        el.addEventListener('mouseleave', () => {
          this.setHoveredEntity(null, null, false);
        });
      });

      const edgeEls = this.svg.querySelectorAll('[data-edge-id]');
      edgeEls.forEach(el => {
        el.addEventListener('mouseenter', () => {
          const edgeId = el.getAttribute('data-edge-id');
          this.setHoveredEntity('EDGE', edgeId, false);
        });
        el.addEventListener('mouseleave', () => {
          this.setHoveredEntity(null, null, false);
        });
      });
    }

    _updateInspectorHud() {
      if (this.hoveredEntity) {
        this._showEntityTooltip(this.hoveredEntity.type, this.hoveredEntity.id);
      } else if (this.selectedEntity) {
        this._showEntityTooltip(this.selectedEntity.type, this.selectedEntity.id);
      } else if (this.tooltip) {
        this.tooltip.classList.add('hidden');
      }
    }

    _showEntityTooltip(type, id) {
      if (!this.tooltip || !this.graphData) return;

      if (type === 'EDGE') {
        const edge = this.graphData.edges.find(e => e.id === id);
        if (!edge) return;
        const receipt =
          this.fsmState.phase === 5 && !this.fsmState.faultTriggered &&
          edge.in_active_ring && this.graphData.active_ring &&
          edge.hop_info
            ? this.graphData.active_ring.crypto.hop_receipts[edge.hop_info.hop - 1]
            : null;

        this.tooltip.innerHTML = `
          <div class="flex items-center justify-between border-b-2 border-ink pb-1.5 mb-1.5">
            <span class="font-mono text-xs font-extrabold text-theme-main">${escapeHtml(edge.irn_hash)} • HSN ${escapeHtml(edge.hsn)}</span>
            <span class="px-2 py-0.5 text-[10px] font-mono rounded ${
              edge.is_itc_risk ? 'pill-amber' : 'surface-card-alt'
            }">${edge.invoice_age_days}d${edge.is_itc_risk ? ' • 16(2) RISK' : ''}</span>
          </div>
          <div class="text-[11px] text-theme-secondary mb-2 font-semibold leading-snug">${escapeHtml(edge.description || 'Verified GSTN B2B Trade Supply')}</div>
          <div class="grid grid-cols-2 gap-x-3 gap-y-1 font-mono text-[10.5px]">
            <div class="text-theme-muted">Base Taxable:</div>
            <div class="text-right font-bold text-theme-main">${formatINR(edge.base_taxable_inr || (edge.gross_amount_inr - edge.gst_included_inr))}</div>
            <div class="text-theme-muted">Included 18% GST:</div>
            <div class="text-right font-bold text-sky-700">+${formatINR(edge.gst_included_inr)}</div>
            <div class="text-theme-muted">Gross Invoice (G_uv):</div>
            <div class="text-right font-bold text-theme-main">${formatINR(edge.gross_amount_inr)}</div>
            <div class="text-theme-muted">TDS (${edge.tds_section}):</div>
            <div class="text-right font-bold text-rose-700">-${formatINR(edge.tds_deduction_inr)}</div>
            <div class="text-theme-main font-extrabold">Net Payable w(u,v):</div>
            <div class="text-right text-emerald-800 font-extrabold">${formatINR(edge.net_payable_inr)}</div>
            ${
              edge.is_itc_risk
                ? `<div class="text-amber-800 font-bold">Sec 16(2) Exposure:</div>
                   <div class="text-right text-amber-900 font-extrabold">${formatINR(edge.total_itc_exposure_inr)}</div>`
                : ''
            }
          </div>
          ${
            receipt
              ? `<div class="mt-2 pt-1.5 border-t border-theme font-mono text-[9.5px] text-theme-muted">
                   CBDC UTR: <span class="text-emerald-800 font-bold">${receipt.utr_number}</span>
                 </div>`
              : ''
          }
        `;
        this.tooltip.classList.remove('hidden');
      } else if (type === 'NODE') {
        const node = this.graphData.nodes.find(n => n.id === id);
        if (!node) return;
        const rm = node.ring_metrics;

        this.tooltip.innerHTML = `
          <div class="flex items-center justify-between border-b-2 border-ink pb-1.5 mb-1.5">
            <span class="font-mono text-xs font-extrabold text-theme-main">${node.short_label} • ${node.name}</span>
            <span class="px-2 py-0.5 text-[10px] font-mono rounded pill-sky">${node.bank}</span>
          </div>
          <div class="text-[10.5px] text-theme-muted mb-1.5 font-semibold">${node.role} • ${node.erp_system} • ${node.credit_rating}</div>
          <div class="grid grid-cols-2 gap-x-3 gap-y-1 font-mono text-[10.5px]">
            <div class="text-theme-muted">Demo wallet:</div>
            <div class="text-right font-bold text-theme-main">${node.vpa}</div>
            <div class="text-theme-muted">Cluster In / Out:</div>
            <div class="text-right font-bold text-theme-main">${formatLakhs(node.cluster_inflow_inr)} / ${formatLakhs(node.cluster_outflow_inr)}</div>
            <div class="text-theme-muted">Cluster Net b(v):</div>
            <div class="text-right font-extrabold ${
              node.cluster_net_balance_inr < 0
                ? 'text-rose-700'
                : node.cluster_net_balance_inr > 0
                ? 'text-emerald-800'
                : 'text-theme-secondary'
            }">${formatINR(node.cluster_net_balance_inr)}</div>
            ${
              rm
                ? `<div class="text-theme-muted font-bold">In-Ring Deficit Δ(vᵢ):</div>
                   <div class="text-right text-purple-900 font-extrabold">${formatINR(rm.delta_deficit_inr)}</div>`
                : ''
            }
          </div>
        `;
        this.tooltip.classList.remove('hidden');
      }
    }

    _startAnimationLoop() {
      const step = () => {
        this.particlePhase = (this.particlePhase + 0.008) % 1;
        this._renderParticlesFrame();
        this.animFrameId = requestAnimationFrame(step);
      };
      this.animFrameId = requestAnimationFrame(step);
    }

    _renderParticlesFrame() {
      const layer = this.svg.querySelector('#cbdc-particles-layer');
      if (!layer || !this.activeEdgePaths.length) {
        if (layer) layer.innerHTML = '';
        return;
      }

      let html = '';
      this.activeEdgePaths.forEach((item, idx) => {
        const pathEl = this.svg.querySelector(`#${item.pathId}`);
        if (!pathEl || typeof pathEl.getTotalLength !== 'function') return;

        const totalLen = pathEl.getTotalLength();
        if (totalLen <= 0) return;

        // Glowing ink-outlined white token bead riding on the ribbon arrow (just like reference image!)
        const t = (this.particlePhase + idx * 0.22) % 1;
        const pt = pathEl.getPointAtLength(t * totalLen);
        const haloColor = item.phase === 5 ? '#68D391' : '#74B9FF';

        html += `
          <g transform="translate(${pt.x.toFixed(1)}, ${pt.y.toFixed(1)})">
            <circle r="9" fill="${haloColor}" fill-opacity="0.45"/>
            <circle r="5.2" fill="#FFFFFF" stroke="#1E2430" stroke-width="2.2"/>
          </g>
        `;
      });

      layer.innerHTML = html;
    }
  }

  global.Chakrika = global.Chakrika || {};
  global.Chakrika.GraphRenderer = SupplyChainGraphRenderer;
